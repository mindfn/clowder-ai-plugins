pluginId: official.connector.weixin
version: 0.1.0-alpha.5
contractVersion: 0.1.0
name: WeChat Personal Connector
description:
  default: Receive and send WeChat Personal iLink messages through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收和发送微信个人号 iLink 消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: permissionWhitelistEnabled
    label: 启用群白名单
    kind: select
    required: false
    options:
      - value: "false"
        label: 不限制群
      - value: "true"
        label: 仅允许白名单群
  - key: permissionCommandAdminOnly
    label: 群命令仅管理员可用
    kind: select
    required: false
    options:
      - value: "false"
        label: 群成员可用
      - value: "true"
        label: 仅管理员可用
  - key: permissionAdminIdsJson
    label: 管理员身份列表（JSON）
    description: 输入供应商身份的 JSON 数组，显式空列表 [] 不会自动补入管理员。
    kind: string
    required: false
  - key: permissionGroupsJson
    label: 群白名单（JSON）
    description: 输入包含 externalChatId 和可选 label 的对象数组；保留已有群的加入时间。
    kind: string
    required: false
  - key: permissionRevision
    label: 当前权限版本
    kind: string
    required: false
    hidden: true
  - key: connector_permissions
    label: 读取连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: read
        label: 读取当前权限
        render: button
        action:
          method: permissions.read
  - key: connector_permissions_apply
    label: 应用连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: configure
        label: 应用权限设置
        render: button
        confirm: 确认以当前表单替换管理员、群白名单及限制？尚未初始化时会创建新权限；旧快照不会覆盖此设置。请先读取当前权限。
        action:
          method: permissions.configure
  - key: legacy_permissions
    label: 一次性导入旧权限
    kind: operation
    required: false
    actions:
      - id: import
        label: 导入旧权限
        render: button
        confirm: 确认从已授权的旧连接器权限快照导入？已有权限不会被覆盖。
        action:
          method: permissions.importLegacy
  - key: botToken
    label: Bot Token
    kind: secret
    required: false
    hidden: true
  - key: voiceItemMode
    label: Voice Item Mode
    kind: select
    required: false
    hidden: true
    options:
      - value: minimal
        label: Minimal
      - value: playtime
        label: Playtime
      - value: playtime-sec
        label: Playtime seconds
      - value: playtime-encode
        label: Playtime encoded (unsafe)
      - value: metadata
        label: Metadata (unsafe)
  - key: enableUnsafeVoiceModes
    label: Enable Unsafe Voice Modes
    kind: boolean
    required: false
    hidden: true
    default: false
  - key: captureInboundVoiceMedia
    label: Capture Inbound Voice Media
    kind: boolean
    required: false
    hidden: true
    default: false
  - key: weixin_qr_login
    label: 微信扫码登录
    kind: operation
    required: true
    target: [botToken]
    actions:
      - id: qr-generate
        label: 生成二维码
        render: button
        resultRender: img
        action:
          method: weixin.qr-generate
        next: qr-status
      - id: qr-status
        label: 等待扫码
        render: polling
        action:
          method: weixin.qr-status
        timeout: 60
        rollback: qr-generate
        next: disconnect
      - id: disconnect
        label: 断开连接
        render: button
        action:
          method: weixin.disconnect
        next: qr-generate
test:
  action:
    method: weixin.test
steps:
  - text: 点击「生成二维码」按钮
  - text: 使用微信扫描二维码并确认授权
  - text: 授权成功后自动连接，无需重启服务
contributions:
  - type: identity
    id: weixin-bot
    displayName: WeChat bot
  - type: message-subscription
    id: weixin
    binding: weixin-bot
    action:
      method: weixin.outbound
    presentation: v1
  - type: media-source
    id: weixin-media
    binding: weixin-bot
    readAction:
      method: weixin.media-source.read
    settleAction:
      method: weixin.media-source.settle
features:
  - id: weixin-messaging
    name: WeChat Personal messaging
    resources: []
    contributions:
      - type: identity
        id: weixin-bot
      - type: message-subscription
        id: weixin
      - type: media-source
        id: weixin-media
    capabilities: [plugin.config.read, plugin.state.get, plugin.state.set, media.read, message.event.subscribe, messaging.send, secret.read, thread.readContent, thread.listMetadata, thread.write]
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
