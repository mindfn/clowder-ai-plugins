pluginId: official.github-operations
version: 0.1.0-alpha.14
contractVersion: 0.1.0
name: GitHub Operations
description:
  default: Track GitHub reviews, checks, conflicts, issues, comments, and repository reconciliation.
  translations:
    zh-CN: 跟踪 GitHub 审查、检查、冲突、Issue、评论与仓库一致性。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: legacyProviderHistory
    label: Copy historical GitHub event metadata
    description: Preserve event kinds, times and source references for later inspection. Bodies and Host governance remain in the original history. Does not replay events or change current tracking.
    kind: operation
    required: false
    actions:
      - id: import
        label: Copy history metadata
        render: button
        confirm: Copy the supplied history metadata? Existing copies are preserved. Original bodies and Host decisions stay in the old history; this does not notify anyone or start tracking.
        action: { method: github.legacy-history.import }
  - key: legacyIssueProgress
    label: Copy settled issue delivery progress
    description: Preserve settled legacy issue cursors as inert history. Fresh tracking takes a new provider baseline; this copy does not register or resume a wait.
    kind: operation
    required: false
    actions:
      - id: import
        label: Copy issue progress
        render: button
        confirm: Copy settled issue progress as history? Existing records are preserved. This does not resume old delivery or activate tracking.
        action: { method: github.legacy-issue-progress.import }
  - key: legacyRepositoryProgress
    label: Copy legacy repository progress once
    description: Stage repository scan and comment progress without starting polling. Register notification destinations separately after the Host cutover. Existing progress is preserved.
    kind: operation
    required: false
    actions:
      - id: import
        label: Copy repository progress
        render: button
        confirm: Copy the supplied repository progress? This stages provider cursors only and does not activate polling or replace Host governance. Stop the old producer before registering the repository here.
        action: { method: github.legacy-repositories.import }
  - key: legacyIssueObservations
    label: Copy legacy issue metadata once
    description: Copy a verified legacy snapshot without replacing existing metadata. Host assignments, signoff, routes, drafts and tracking remain unchanged. Requires the Host migration adapter to supply the snapshot.
    kind: operation
    required: false
    actions:
      - id: import
        label: Copy legacy metadata
        render: button
        confirm: Copy the supplied legacy issue metadata? Existing records and all Host governance data will be preserved. This does not start tracking.
        action: { method: github.legacy-issues.import }
  - key: publishRepositories
    label: Repositories allowed for public issue drafts
    description: Comma-separated owner/repository names. Empty disables issue publishing.
    kind: string
    required: false
  - key: issueDrafts
    label: Plugin-native issue drafts
    description: Review sanitized drafts before publishing. Legacy Host drafts remain in their existing entry point.
    kind: operation
    required: false
    actions:
      - id: list
        label: Drafts
        render: status
        resultRender: rows
        action: { method: github.draft.list }
      - id: publish
        label: Publish or recover publication
        render: row
        confirm: Publish this sanitized draft to its GitHub repository? If publication already started, only check its existing outcome.
        action: { method: github.draft.publish }
        next: list
      - id: cancel
        label: Cancel draft
        render: row
        confirm: Cancel this unpublished draft? Its history will remain stored.
        action: { method: github.draft.cancel }
        next: list
  - key: webhookSecret
    label: GitHub Webhook Secret
    kind: secret
    required: false
  - key: token
    label: Personal Access Token
    kind: secret
    required: false
  - key: mcpToken
    label: MCP Token
    kind: secret
    required: false
  - key: setupNoiseBotLogins
    label: Setup Noise Bot Logins
    kind: string
    required: false
  - key: cloudReviewerLogins
    label: Cloud Reviewer GitHub Logins
    kind: string
    required: false
contributions:
  - type: tool
    id: refresh-pull-requests
    name: github_refresh_pull_requests
    description: Fetch one bounded PR metadata page into a private staged generation. Repeat while incomplete; retries resume persisted review-page progress. Only a complete generation becomes visible. Provider observations do not grant Host governance authority.
    inputSchema:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        restart: { type: boolean }
    action: { method: github.pull-requests.refresh }
  - type: tool
    id: observe-review-trigger
    name: github_observe_review_trigger
    description: Read exact review-trigger acceptance and subsequent feedback from GitHub. This is a provider observation, not admission, wait, reviewer or lease authority. Unavailable or incomplete evidence fails explicitly.
    inputSchema:
      type: object
      additionalProperties: false
      required: [repoFullName, prNumber, triggerCommentId]
      properties:
        repoFullName: { type: string, maxLength: 256 }
        prNumber: { type: integer, minimum: 1 }
        triggerCommentId: { type: integer, minimum: 1 }
    action: { method: github.review-trigger.observe }
  - type: tool
    id: issue-metadata
    name: github_issue_metadata
    description: Read installation-private issue metadata by repository and number. Imported legacy fields do not establish assignment, signoff, route acceptance or current provider state.
    inputSchema:
      type: object
      additionalProperties: false
      required: [repo, number]
      properties:
        repo: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        number: { type: integer, minimum: 1 }
    action: { method: github.issue.metadata }
  - type: tool
    id: get-issue-draft
    name: github_get_issue_draft
    description: Read the complete sanitized draft and its publication outcome by ID, including retained cancelled or published records. Does not publish.
    inputSchema:
      type: object
      additionalProperties: false
      required: [draftId]
      properties:
        draftId: { type: string, pattern: '^[a-f0-9]{64}$' }
    action: { method: github.draft.get }
  - type: tool
    id: create-issue-draft
    name: github_create_issue_draft
    description: Save sanitized public issue text as an installation-private draft. Publishing requires the owner-confirmed Settings action. Cannot import legacy Host ownership or confirmation.
    inputSchema:
      type: object
      additionalProperties: false
      required: [requestId, repo, title, bodyMarkdown]
      properties:
        requestId: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
        repo: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        title: { type: string, minLength: 1, maxLength: 256 }
        bodyMarkdown: { type: string, maxLength: 65536 }
    action: { method: github.draft.create }
  - type: tool
    id: repository-observations
    name: github_repository_observations
    description: Read a bounded page of locally collected provider observations, including webhook-only subjects. No network fetch, governance verdict, assignment or closure action.
    inputSchema:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        after: { type: string }
        prAfter: { type: string, maxLength: 160 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    action: { method: github.repository.observations }
  - type: tool
    id: preview-issue
    name: github_preview_issue
    description: Sanitize explicitly supplied public issue text for preview. Does not save a draft, authenticate its owner, or publish to GitHub.
    inputSchema:
      type: object
      additionalProperties: false
      required: [title, bodyMarkdown]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        bodyMarkdown: { type: string, maxLength: 65536 }
    action: { method: github.issue.preview }
  - type: skill
    id: github-operations
    path: skills/github-operations
  - type: mcp
    id: github-tracking
    runtime: { transport: stdio, entrypoint: dist/mcp-entrypoint.js }
  - type: webhook
    id: repository-events
    path: github/events
    methods: [POST]
    verificationSecretRef: webhookSecret
    action: { method: github.webhook }
  - type: identity
    id: github-notification
    displayName: GitHub
  - type: identity
    id: github-wait
    displayName: GitHub
  - type: tool
    id: recommend-triage
    name: github_recommend_triage
    description: Compare supplied issue observations and recommend a direction. This does not authenticate reviewers, accept a case, assign a guardian, or record a formal decision.
    inputSchema:
      type: object
      additionalProperties: false
      required: [issueType, observations]
      properties:
        issueType: { type: string, enum: [bug, feature, enhancement, question] }
        observations:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [sourceId, verdict]
            properties:
              sourceId: { type: string, minLength: 1, maxLength: 256 }
              verdict: { type: string, enum: [WELCOME, NEEDS-DISCUSSION, POLITELY-DECLINE] }
              reasonCode: { type: string, maxLength: 256 }
    action: { method: github.triage.recommend }
  - type: tool
    id: register-pr-tracking
    name: github_register_pr_tracking
    description: Register a durable PR wait through the native MCP server. Host supplies the authenticated owner and thread; reuse registrationId after an unknown response.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        registrationId: { type: string, minLength: 1, maxLength: 200 }
        repoFullName: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        prNumber: { type: integer, minimum: 1 }
        nextStep: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: integer, minimum: 1 }
        autoRenew: { type: boolean }
        goal:
          type: object
          additionalProperties: false
          required: [kind, authorLogins]
          properties:
            kind: { type: string, enum: [await_reply_from] }
            authorLogins: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1 } }
        when:
          type: array
          minItems: 1
          maxItems: 8
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind: { type: string, enum: [pr_head_changed, pr_review_decision_changed, pr_ci_terminal, pr_became_conflicting] }
              - type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind: { type: string, enum: [pr_review_result_available] }
                  triggerCommentId: { type: integer, minimum: 1 }
              - type: object
                additionalProperties: false
                required: [kind, reviewThreadIds]
                properties:
                  kind: { type: string, enum: [pr_review_thread_changed] }
                  reviewThreadIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1 } }
              - type: object
                additionalProperties: false
                required: [kind, authorLogins]
                properties:
                  kind: { type: string, enum: [pr_conversation_comment_added, pr_inline_comment_added] }
                  authorLogins: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1 } }
      required: [registrationId, repoFullName, prNumber]
    action: { method: github.typed-wait.register-pr }
  - type: tool
    id: register-issue-tracking
    name: github_register_issue_tracking
    description: Register a durable issue wait through the native MCP server for the authenticated owner and thread. Reuse registrationId after an unknown response.
    inputSchema:
      type: object
      additionalProperties: false
      required: [registrationId, repoFullName, issueNumber]
      properties:
        registrationId: { type: string, minLength: 1, maxLength: 200 }
        repoFullName: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        issueNumber: { type: integer, minimum: 1 }
        nextStep: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: integer, minimum: 1 }
        autoRenew: { type: boolean }
        when:
          type: array
          minItems: 1
          maxItems: 2
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind: { type: string, enum: [issue_comment_added] }
                  authorLogins: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1 } }
              - type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind: { type: string, enum: [issue_author_commented] }
    action: { method: github.typed-wait.register-issue }
  - type: tool
    id: unregister-tracking
    name: github_unregister_tracking
    description: Stop tracking a PR or issue while retaining its private delivery history.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        subjectKey: { type: string, pattern: '^(pr|issue):[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[1-9][0-9]*$' }
      required: [subjectKey]
    action: { method: github.typed-wait.unregister }
  - type: tool
    id: list-tracking
    name: github_list_tracking
    description: List this installation's PR and issue tracking status and pending deliveries.
    inputSchema: { type: object, additionalProperties: false, properties: {} }
    action: { method: github.tracking.list }
  - type: schedule
    id: pr-tracking
    schedule: { kind: interval, everyMs: 60000 }
    action: { method: github.pr-tracking }
    policy: { overlap: skip, timeoutMs: 30000 }
  - type: tool
    id: inspect-subject
    name: github_inspect_subject
    description: Read this installation's PR or issue observations and derived status. These are provider facts, not a governance verdict or approval.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        subjectKey: { type: string, pattern: '^(pr|issue):[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[1-9][0-9]*$' }
        fromSequence: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
      required: [subjectKey]
    action: { method: github.subject.inspect }
  - type: tool
    id: inspect-legacy-history
    name: github_inspect_legacy_history
    description: Read copied historical GitHub event metadata. This is archived history, not current state, delivery progress or a governance verdict. Original bodies and Host decisions remain at the source.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        subjectKey: { type: string, pattern: '^(pr|issue):[a-z0-9_.-]+/[a-z0-9_.-]+#[1-9][0-9]*$' }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
      required: [subjectKey]
    action: { method: github.legacy-history.inspect }
  - type: schedule
    id: repo-scan
    schedule: { kind: interval, everyMs: 300000 }
    action: { method: github.repo-scan }
    policy: { overlap: skip, timeoutMs: 30000 }
  - type: schedule
    id: issue-tracking
    schedule: { kind: interval, everyMs: 60000 }
    action: { method: github.issue-tracking }
    policy: { overlap: skip, timeoutMs: 30000 }
  - type: schedule
    id: repo-comment-poll
    schedule: { kind: interval, everyMs: 60000 }
    action: { method: github.repo-comment-poll }
    policy: { overlap: skip, timeoutMs: 30000 }
  - type: schedule
    id: community-reconciler
    schedule: { kind: interval, everyMs: 600000 }
    action: { method: github.community-reconciler }
    policy: { overlap: skip, timeoutMs: 120000 }
  - type: tool
    id: register-repository
    name: github_register_repository
    description: Register an authorized repository inbox for package-owned collection and notifications.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        repo: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        guardThreadId: { type: string, minLength: 1 }
        guardCatId: { type: string, minLength: 1 }
        reviewMode: { type: string, enum: [observe_only, maintainer_review] }
        cloudReviewPolicy: { type: string, enum: [optional, required] }
      required: [repo, guardThreadId, guardCatId]
    action: { method: github.repository.register }
  - type: tool
    id: unregister-repository
    name: github_unregister_repository
    description: Stop repository collection while retaining historical events.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        repo: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
      required: [repo]
    action: { method: github.repository.unregister }
  - type: tool
    id: list-repository
    name: github_list_repository
    description: List configured repository inboxes and separately identify repositories with published private PR observations. Does not register polling or fetch GitHub.
    inputSchema:
      type: object
      additionalProperties: false
      properties: {}
    action: { method: github.repository.list }
features:
  - id: github-collaboration
    name: GitHub collaboration operations
    resources: []
    contributions:
      - { type: tool, id: refresh-pull-requests }
      - { type: tool, id: observe-review-trigger }
      - { type: tool, id: issue-metadata }
      - { type: tool, id: get-issue-draft }
      - { type: tool, id: create-issue-draft }
      - { type: tool, id: repository-observations }
      - { type: tool, id: preview-issue }
      - { type: skill, id: github-operations }
      - { type: mcp, id: github-tracking }
      - { type: webhook, id: repository-events }
      - { type: tool, id: list-repository }
      - { type: tool, id: unregister-repository }
      - { type: tool, id: register-repository }
      - { type: identity, id: github-notification }
      - { type: identity, id: github-wait }
      - { type: tool, id: register-pr-tracking }
      - { type: tool, id: register-issue-tracking }
      - { type: tool, id: unregister-tracking }
      - { type: tool, id: list-tracking }
      - { type: tool, id: inspect-subject }
      - { type: tool, id: inspect-legacy-history }
      - { type: tool, id: recommend-triage }
      - { type: schedule, id: pr-tracking }
      - { type: schedule, id: repo-scan }
      - { type: schedule, id: issue-tracking }
      - { type: schedule, id: repo-comment-poll }
      - { type: schedule, id: community-reconciler }
    capabilities: [schedule.register, plugin.config.read, secret.read, plugin.state.get, plugin.state.set, task.read, task.write, thread.listMetadata, thread.write, messaging.send]
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
