pluginId: official.rsi
version: 0.1.0-alpha.58
contractVersion: 0.4.0-candidate.0
name: RSI 能力进化
description:
  default: 给项目设评估项，每晚按计划跑实验、出结论，你选方向后进入下一轮。
  translations:
    en: Set objectives for a project; experiments run nightly, conclusions come back for you to choose the next direction.
icon: { type: svg, src: assets/icon.svg }
steps:
  - text: 启用后，在工作台面板里打开「RSI 能力进化」，新建评估项。
contributions:
  - { type: webhook, id: rsi.view, path: rsi/view, methods: [GET], action: { method: rsi.view } }
  - { type: webhook, id: rsi.act, path: rsi/act, methods: [POST], action: { method: rsi.act } }
  - { type: identity, id: rsi.identity, displayName: RSI }
  - { type: message-subscription, id: rsi.execution, binding: rsi.identity, action: { method: rsi.delivery }, presentation: v2 }
  - type: schedule
    id: rsi.schedule
    schedule: { kind: interval, everyMs: 180000 }
    action: { method: rsi.tick }
    policy: { overlap: skip, timeoutMs: 30000 }
  - type: tool
    id: rsi.task
    name: rsi.task
    description: >-
      被 RSI 叫醒后首先调用 {}。只在评估项 thread 内、轮到你的成员身份下可用。
      返回项目目录、当前步骤、每个要填的 item 的 id/含义/格式/例子、依赖内容及版本；本次调用认领步骤，后续提交会检查这些版本。
      初始化按返回的 ask 调查项目，再调用 rsi.submit；第 3 步先登记 rsi.executor，第 4 步提交 metrics，第 5 步提交 upcoming 计划。
      跑完周期后 evaluate 包含每组每种子的真实 runs/metrics、comparison 中的均值±样本标准差、逐种子值与护栏检查，以及之前周期的 library，读完调 rsi.conclude；人工选方向后 version 包含修改要求，改项目、提交 git，再调 rsi.version。
    inputSchema: { type: object, properties: {}, additionalProperties: false }
    action: { method: rsi.task }
  - type: tool
    id: rsi.submit
    name: rsi.submit
    description: >-
      提交 rsi.task 刚分给你的初始化步骤。step 用 1–7 或 goal/scope/run/rules/design/feedback/baseline。
      items 必须含本步全部非 userOwned 项，每项 {id,value,facts?:[{k,v}],can?,rec?:explore|fixed|excluded,tag?}；value 是非空字符串，unknowns/next 是字符串。
      例 {step:1,items:[{id:"cp-good",value:"同种子得分提高",facts:[{k:"依据",v:"README"}]},{id:"cp-adopt",value:"护栏通过后采用"}],unknowns:"配额未知",next:"确认条件"}。
      第 3 步带 window:"每晚 20:00–08:00"（或在 cp-trigger item 的 value 写明时段），先用 rsi.executor 登记并通过预检，或附 executor 同样的命令字段；预检和本步提交都完成才进入下一步。
      第 4 步必须附 metrics:{version:"E1",items:[{id:"score",name:"得分",how:"metrics.json 的 score",dir:"up",unit:"分",locked:true,guard:false},{id:"cost",name:"成本",how:"metrics.cost",dir:"down",guard:true,threshold:2}]}。护栏必须有数值 threshold；dir:down 表示不得超过，up 表示不得低于。主指标（第一个非护栏量尺）可带 minDelta：改动组至少比同周期对照提升这么多才算赢；或带 margin：不比同周期对照差超过这么多就算过。判候选和复验都按所选口径；minDelta 和 margin 不能同时写。
      第 5 步必须附 upcoming:{groups:[{id:"control",label:"对照",vars:{},control:true},{id:"change",label:"改动",vars:{lr:0.001}}],seeds:[11,23]}；第 7 步可更新它。
      可附 goal 对象、docs:[{id,kind:project|provided|feedback,title,body,sources:[]}]。依赖版本变化会拒绝，重新 rsi.task；成功会持久化并叫醒依赖已齐的下一成员，用户项仍需页面确认。
    inputSchema:
      type: object
      additionalProperties: false
      required: [step, items]
      properties:
        step: { oneOf: [{type: integer, minimum: 1, maximum: 7}, {type: string, enum: [goal, scope, run, rules, design, feedback, baseline]}] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, value]
            properties:
              id: { type: string, minLength: 1 }
              value: { type: string, minLength: 1 }
              facts: { type: array, items: {type: object, required: [k, v], properties: {k: {type: string}, v: {type: string}}, additionalProperties: false} }
              can: { type: string }
              rec: { type: string, enum: [explore, fixed, excluded] }
              tag: { type: string }
        unknowns: { type: string }
        next: { type: string }
        goal: { type: object }
        executor: { type: object }
        metrics: { type: object }
        upcoming: { type: object }
        window: { type: string }
        docs: { type: array, items: {type: object} }
    action: { method: rsi.submit }
  - type: tool
    id: rsi.executor
    name: rsi.executor
    description: >-
      准备成员在第 3 步调用 rsi.task 后登记本机执行方式，必填 preflight/submit/collect，选填 get/cancel/analyze/resultMap/failureField/timeout/poll。
      timeout 是前台 submit 的秒数上限，超过就停止并按环境失败重试一次；不写时取本评估项最长一次成功运行的 3 倍（至少 10 分钟），还没有成功运行时不限；带 get 时它也限制异步任务从 submit 到查询结束的总时长，超过就调 cancel，同样按环境失败重试一次。每次重试从空的 {run} 目录开始，上一次尝试的文件改名为 {run}.attempt-N 保留。
      命令由宿主系统的 shell 执行（macOS/Linux 是 sh，Windows 是 cmd；rsi.task 的 shell 字段写明），插件只负责按时拉起、记录和停止，不管命令内容；占位符按这个 shell 加引号。
      不带 commit 的配置版本在 task.projectPath 执行；带 commit 的版本在插件 dataPath 下该提交的独立 git worktree 执行，worktree 里只有已提交的文件：.venv 等未提交的环境写项目里的绝对路径。例 {preflight:"test -f train.py",submit:".venv/bin/python train.py --config {config} --out {run} --seed {seed}",collect:"{run}/metrics.json"}。
      {config} 是插件生成的 JSON 配置（版本 config 合并组 vars 和 seed）；{run} 是 runs/<objective>/<cycle>/<group>-s<seed>；{seed} 是整数；{start} 是本次运行开始、{end} 是 submit/get 结束的 epoch 秒（{end} 只给 collect 和 analyze），用来从跨运行累积的日志里切出这一次；替换会做 shell 引号处理，不要再包引号。
      collect 可为无空格的 JSON 路径模板，或输出 JSON 的命令。默认按量尺 id 读顶层或 metrics 对象；NaN 与 failureField 指定字段的非空失败值算真实结果，不重试；可传 resultMap:[{metric:"score",field:"summary.score"}]。
      立即启动 preflight，工具返回 probing；通过才标执行器 passed。再用 rsi.submit 交第 3 步 items（也可先交，预检成功会完成它）。预检失败会显示失败，页面重试后重新 task/executor。
      不带 get 时 submit 在前台运行到完成；带 get 时 submit 输出 job id 字符串或 {"jobId":"..."}，get 使用 {job} 并输出 {"state":"queued|running|done|failed|cancelled","exitCode":0}，每 poll 秒（默认 1）轮询至 done，再 collect。停止或超时时调用 cancel；无 cancel 的持久任务重启后继续轮询。非零退出/OOM/被杀自动重试一次，不算结果；重试后仍失败时先跑 analyze 取错误特征，再调 cancel 清理。preflight 可输出 JSON {python,driver,dataVersion}；collect 可带 dataVersion。调度在运行时段里开的周期只在时段内跑：时段外不开新运行，时段结束时停掉正在跑的（杀掉命令或 cancel 任务），放回队列下一晚接着跑，不算重试；「跑一轮」开的不受时段限制。
    inputSchema:
      type: object
      additionalProperties: false
      required: [preflight, submit, collect]
      properties:
        preflight: { type: string, minLength: 1 }
        submit: { type: string, minLength: 1 }
        get: { type: string, minLength: 1 }
        cancel: { type: string, minLength: 1 }
        collect: { type: string, minLength: 1 }
        analyze: { type: string, minLength: 1 }
        failureField: { type: string, minLength: 1 }
        timeout: { type: integer, minimum: 1 }
        poll: { type: integer, minimum: 1 }
        resultMap: { type: array, items: {type: object, required: [metric, field], properties: {metric: {type: string}, field: {type: string}}, additionalProperties: false} }
    action: { method: rsi.executor }
  - type: tool
    id: rsi.version
    name: rsi.version
    description: >-
      人工在页面选完周期方向后，或周期运行失败、插件派来修复时（rsi.task 的 version.repair 写明失败的组、种子、错误和日志），仅治理执行成员可用。修复时只修让它跑不起来的问题，修好提交后照常交 {change,commit,config}，插件用修好的版本重跑这一周期的计划；修不了就交 {cannot:"原因"}，交给评估成员下结论。先 rsi.task 读 version 要求。改代码并提交 git 后交 {change,commit,config}；只改配置可省略 commit。在单独的 git worktree 里、自己的分支上改并在那里提交；不要在项目目录本身改文件、提交、切分支、stash 或 reset（用户的工作区里可能有还没提交的改动）。
      例 {change:"降低学习率",commit:"a1b2c3d",config:{lr:0.001,batch:8}}。若提供 commit，必须是 7–40 位 git 十六进制提交号；config 是 JSON 对象或项目内 JSON 文件路径。
      插件记录 v2/v3…，默认版本保持不变。下一周期带当前默认对照；胜出只成为候选，下周期同轮对照、换新种子确认，保持改善且护栏通过后才采用。代码 worktree 在评估项完成/退役时移除。
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        change: { type: string, minLength: 1 }
        commit: { type: string, pattern: '^[a-fA-F0-9]{7,40}$' }
        config: { oneOf: [{type: object}, {type: string, minLength: 1}] }
        cannot: { type: string, minLength: 1 }
    action: { method: rsi.version }
  - type: tool
    id: rsi.conclude
    name: rsi.conclude
    description: >-
      本周期所有组×种子完成后，仅评估成员可用。先 rsi.task 读取 evaluate.comparison 的同周期对照、逐组均值±标准差及逐种子值/护栏/失败记录，和 evaluate.library 的历史周期，再交 {cycle,verdict,findings,options:[{k,title,why,kind?,cites?:[libraryId]}]}；kind 说明方向是哪一类：code 改代码、variable 调变量、metric 改指标、goal 改目标、discriminate 区分实验，不写就不标类别。
      例 {cycle:1,verdict:"tune",findings:["改动组两个种子均提高得分，需新种子复验"],options:[{k:"lr",title:"降低学习率",why:"护栏稳定但收敛慢"}]}。
      verdict 为 baseline/keep/tune/rollback/sunset/insufficient；findings 是非空字符串或字符串数组；options 的 k 必须互异；有历史周期条目时每个方向必须在 cites 引用至少一条。返回 comparison（均值/区间/逐种子值）、confirmation 和 stop。
      有分析成员时 options 可以省略：插件把这份结论发给分析成员，等他们用 rsi.propose 交齐方向（或等满 20 分钟）再发结论卡。方向可带 target（要改的对象，例如 lr），几个分析成员的第一方向种类和 target 相同就算意见一致。
      kind:execution 是执行修复（重试、超时、目录这类不该改变测量结果的修复）：选中后出的版本直接成为默认、不进对比，并沿用当前默认版本的 config 和变量，只换代码提交。方向可带数值预测 expect {lo,hi,metric?}：选中这个方向后出的版本，第一次和同周期对照比时，该指标（默认主指标）的差值落在 [lo,hi] 内算命中，结论卡和页面会显示命中率。
      成功会在 thread 发结论卡并在页面显示方向，等待用户通过 expDecide 选方向；候选先安排新种子确认，其他新方向叫醒准备成员生成下一版本；same 可按当前默认继续。运行时段内，第一方向（有分析成员时看他们的，几位要意见一致）的 kind 属于评估项允许夜里自己定的类别（默认 execution 和 variable）时，插件不等人直接采纳。目标或最多周期满足时自动完成，并发原因卡。不要自行代替用户决策。
    inputSchema:
      type: object
      additionalProperties: false
      required: [cycle, verdict, findings]
      properties:
        cycle: { type: integer, minimum: 1 }
        verdict: { type: string, enum: [baseline, keep, tune, rollback, sunset, insufficient] }
        findings: { oneOf: [{type: string, minLength: 1}, {type: array, minItems: 1, items: {type: string, minLength: 1}}] }
        options: { type: array, minItems: 1, items: {type: object, required: [k, title, why], properties: {k: {type: string, minLength: 1}, title: {type: string, minLength: 1}, why: {type: string, minLength: 1}, kind: {type: string, enum: [code, variable, metric, goal, discriminate, execution]}, target: {type: string, minLength: 1}, expect: {type: object, required: [lo, hi], properties: {lo: {type: number}, hi: {type: number}, metric: {type: string, minLength: 1}}, additionalProperties: false}, cites: {type: array, items: {type: string, minLength: 1}}}, additionalProperties: false} }
    action: { method: rsi.conclude }
  - type: tool
    id: rsi.propose
    name: rsi.propose
    description: >-
      评估成员交了周期结论后，插件叫醒的分析成员可用。先 rsi.task 读 analyze（评估结论、同周期对照、各组结果、之前周期的资料库），再交 {cycle,options:[{k,title,why,kind?,target?,cites?}]}。
      例 {cycle:3,options:[{k:"steps",title:"训练步数 150 → 300",why:"第 150 步时训练准确率还在上升",kind:"variable",target:"steps",cites:["<资料库 id>"]}]}。
      kind 为 code/variable/metric/goal/discriminate；target 写这个方向要改的对象；k 互异；有历史周期条目时每个方向必须在 cites 引用至少一条。几个分析成员的方向署名并列；全部交齐（或等满 20 分钟）插件发结论卡，第一方向种类和 target 都相同时标为意见一致。运行时段内，意见一致（只有一位时看他的）且第一方向的 kind 属于评估项允许夜里自己定的类别（默认 execution 和 variable）时，插件不等人直接采纳。
    inputSchema:
      type: object
      additionalProperties: false
      required: [cycle, options]
      properties:
        cycle: { type: integer, minimum: 1 }
        options: { type: array, minItems: 1, items: {type: object, required: [k, title, why], properties: {k: {type: string, minLength: 1}, title: {type: string, minLength: 1}, why: {type: string, minLength: 1}, kind: {type: string, enum: [code, variable, metric, goal, discriminate, execution]}, target: {type: string, minLength: 1}, expect: {type: object, required: [lo, hi], properties: {lo: {type: number}, hi: {type: number}, metric: {type: string, minLength: 1}}, additionalProperties: false}, cites: {type: array, items: {type: string, minLength: 1}}}, additionalProperties: false} }
    action: { method: rsi.propose }
features:
  - id: rsi
    name: RSI 能力进化
    resources: []
    contributions:
      - { type: webhook, id: rsi.view }
      - { type: webhook, id: rsi.act }
      - { type: identity, id: rsi.identity }
      - { type: message-subscription, id: rsi.execution }
      - { type: schedule, id: rsi.schedule }
      - { type: tool, id: rsi.task }
      - { type: tool, id: rsi.submit }
      - { type: tool, id: rsi.executor }
      - { type: tool, id: rsi.version }
      - { type: tool, id: rsi.conclude }
      - { type: tool, id: rsi.propose }
data:
  - { name: rsi, dataClass: user-authored, strategy: retained }
runtime:
  transport: builtin
  entrypoint: dist/index.js
  dataDirectory: rsi
