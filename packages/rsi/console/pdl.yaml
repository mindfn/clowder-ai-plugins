ns: rsi
inserts:
  - id: rsi.panel
    anchor: panel.tools
    at: inside
    node:
      title: t:rsi.panel
      icon: bolt
      open:
        node: rsi.panel
      tool: true
views:
  rsi.panel:
    page: true
    blocks:
      - type: split
        picked: $.home.picked
        back:
          act: plugSet
          args:
            plugin: official.rsi
            k: pick
            v: $.home.listKey
        left:
          - type: head
            title: t:rsi.home.title
            help: t:rsi.home.help
          - type: toolbar
            items:
              - type: select
                id: rsi-project
                options:
                  - from: $.home.projects
                    item:
                      v: "@choice"
                      label: "@name"
                value: $.home.projectChoice
                prefix: t:rsi.projectPrefix
                label: t:rsi.project
                change: plugSet
                args:
                  k: project
                  also:
                    pick: ""
          - type: list
            id: rsi-nav
            from: $.home.navs
            row:
              layout: line
              key: "@k"
              title:
                text:
                  t: rsi.nav
                  args:
                    - "@k"
              cols:
                - v:
                    text: "@count"
                    num: true
                  w: num
                  when: "@count"
              tone:
                - when: "@selected"
                  value: selected
                - value: ""
              act: plugSet
              args:
                k: pick
                v: "@pickKey"
          - type: box
            variant: scroll
            blocks:
              - type: section
                title: t:rsi.objectives
                actions:
                  - type: button
                    icon: plus
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNewExp
                      thread: $.currentThread.id
                      project: $.home.projectId
                      cats: $.members.rows
                    disabled: $.pending
                    when: $.home.exp
                  - type: button
                    icon: plus
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNew
                    disabled: $.pending
                    when: "!$.home.exp"
                blocks:
                  - type: empty
                    text: t:rsi.noObjectives
                    when: "!$.home.hasObjectives"
                  - type: tree
                    id: rsi-objectives
                    nodes: $.home.nodes
                    ready: true
                    when: $.home.hasObjectives
                    row:
                      layout: two
                      title: "@name"
                      inline:
                        - status:
                            of: "@state"
                            map:
                              collecting:
                                tone: ""
                                text: t:rsi.state.collecting
                              pending:
                                tone: warn
                                text: t:rsi.state.pending
                              baseline:
                                tone: info
                                text: t:rsi.state.baseline
                              paused:
                                tone: ""
                                text: t:rsi.state.paused
                              exhausted:
                                tone: warn
                                text: t:rsi.state.exhausted
                              analyzing:
                                tone: info
                                text: t:rsi.state.analyzing
                              preparing:
                                tone: info
                                text: t:rsi.state.preparing
                              retired:
                                tone: ""
                                text: t:rsi.state.retired
                              ready:
                                tone: warn
                                text: t:rsi.state.ready
                              running:
                                tone: info
                                text: t:rsi.state.running
                              stalled:
                                tone: danger
                                text: t:rsi.state.stalled
                              _: ""
                          when: "@state"
                      sub:
                        parts:
                          - text:
                              t: rsi.exp.triggerOf
                              args:
                                - "@trigger"
                            when: "@trigger"
                          - text:
                              t: rsi.now.collecting
                              args:
                                - "@cycle.got"
                                - "@cycle.need"
                            when: "@cycle"
                      cols:
                        - v:
                            text: "@running.o"
                            mono: true
                          w: id
                          when: "@running"
                      cur: "@selected"
                      acts:
                        - label: t:rsi.delete.action
                          icon: delete
                          act: dialog
                          args:
                            kind: rsiDelete
                            objective: "@id"
                            name: "@name"
                    select:
                      act: plugSet
                      args:
                        k: pick
                        v: "@pickKey"
        right:
          - type: empty
            icon: bolt
            text: t:rsi.noObjectivesHint
            when:
              of: $.home.pick.k
              map:
                none: true
                _: false
            action:
              type: each
              from: $.home.projects
              control:
                type: stack
                when:
                  - of: "@id"
                    gte: $.home.projectId
                  - of: $.home.projectId
                    gte: "@id"
                items:
                  - type: button
                    primary: true
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNewExp
                      thread: $.currentThread.id
                      project: $.home.projectId
                      cats: $.members.rows
                    disabled: $.pending
                    when: "@exp"
                  - type: button
                    primary: true
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNew
                    disabled: $.pending
                    when: "!@exp"
          - type: view
            id: rsi.objective
            when:
              - of: $.home.pick.k
                map:
                  obj: true
                  _: false
              - "!$.home.pick.exp"
          - type: view
            id: rsi.exp
            when:
              - of: $.home.pick.k
                map:
                  obj: true
                  _: false
              - $.home.pick.exp
          - type: view
            id: rsi.caps
            when:
              of: $.home.pick.k
              map:
                caps: true
                _: false
          - type: view
            id: rsi.library
            when:
              of: $.home.pick.k
              map:
                library: true
                _: false
          - type: view
            id: rsi.cards
            when:
              of: $.home.pick.k
              map:
                cards: true
                _: false
    panel:
      - t:rsi.panel
      - bolt
      - ""
      - other
      - t:rsi.home.help
    sources:
      home: home
      members: host:members
      currentThread: host:currentThread
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.exp:
    blocks:
      - type: head
        variant: detail
        title: $.exp.name
        actions:
          - type: status
            text:
              t: rsi.state
              args:
                - $.exp.state
            tone:
              of: $.exp.state
              map:
                pending: warn
                preparing: info
                ready: warn
                running: info
                paused: warn
                _: ""
          - type: button
            when:
              of: $.exp.state
              map:
                ready: true
                pending: true
                running: true
                _: false
            label: t:rsi.life.pause
            act: plugin
            args:
              request: life
              op: pause
            disabled: $.pending
          - type: button
            when:
              of: $.exp.state
              map:
                _: false
                paused: true
            label: t:rsi.life.resume
            act: plugin
            args:
              request: life
              op: resume
            disabled: $.pending
          - type: button
            when:
              of: $.exp.state
              map:
                ready: true
                pending: true
                running: true
                paused: true
                _: false
            label: t:rsi.life.finish
            act: plugin
            args:
              request: life
              op: finish
            disabled: $.pending
          - type: button
            when:
              of: $.exp.next.k
              map:
                _: false
                stale: true
            primary: true
            label: t:rsi.exp.redo
            act: plugin
            args:
              request: initRedo
            disabled: $.pending
          - type: button
            when: $.exp.thread
            label: t:rsi.exp.thread
            act: thread
            args:
              id: $.exp.thread
          - type: button
            iconOnly: true
            icon: delete
            label: t:rsi.delete.action
            act: dialog
            args:
              kind: rsiDelete
              objective: $.exp.id
              name: $.exp.name
      - type: toolbar
        left:
          - type: seg
            value: $.exp.section
            options:
              - v: manage
                label: t:rsi.exp.sec.manage
              - v: execute
                label: t:rsi.exp.sec.execute
            act: plugSet
            args:
              k: expSec
        right:
          - type: button
            label: t:rsi.refresh
            act: plugSet
            args:
              k: _r
              v: ""
      - type: each
        from:
          - {}
        when:
          of: $.exp.section
          map:
            manage: true
            _: false
        blocks:
          - type: section
            title: t:rsi.exp.sec.goal
            actions:
              - type: button
                label: t:rsi.exp.prep.edit
                when: "!$.exp.editingGoal"
                act: plugSet
                args:
                  k: editGoal
                  v: "1"
              - type: button
                label: t:rsi.common.cancel
                when: $.exp.editingGoal
                act: plugSet
                args:
                  k: editGoal
                  v: ""
            blocks:
              - type: fold
                key: rsi-goal-fold
                height: s
                when:
                  - "!$.exp.editingGoal"
                  - $.exp.goalQuote
                blocks:
                  - type: markdown
                    text: $.exp.goalQuote
              - type: input
                id: rsi-goal-edit
                rows: 3
                value: $.exp.goal.statement
                placeholder: t:rsi.newExp.statementHint
                when: $.exp.editingGoal
                go: plugin
                goLabel: t:rsi.common.save
                args:
                  request: goalEdit
                  objective: $.exp.id
          - type: section
            title: t:rsi.exp.sec.execStatus
            actions:
              - type: button
                label: t:rsi.abort.action
                danger: true
                when: $.exp.progress.canAbortCycle
                act: dialog
                args:
                  kind: rsiAbortCycle
                  objective: $.exp.id
                disabled: $.pending
              - type: button
                primary: true
                label: t:rsi.exp.triggerNow
                when:
                  - $.exp.prep.ready.canTriggerNow
                  - "!$.exp.prep.ready.selected"
                act: plugin
                args:
                  request: runCycle
                  objective: $.exp.id
                disabled: $.pending
              - type: button
                label: t:rsi.exp.goExecute
                when: $.exp.execStatus.started
                act: plugSet
                args:
                  k: expSec
                  v: execute
            blocks:
              - type: text
                when:
                  - "!$.exp.execStatus.started"
                  - "!$.exp.execStatus.ready"
                parts:
                  - status:
                      tone: info
                      text: t:rsi.exp.execStatusNotStarted
                  - text:
                      t: rsi.exp.dagReadyProgressOf
                      args:
                        - $.exp.execStatus.doneCount
                        - $.exp.execStatus.totalCount
              - type: text
                when:
                  - "!$.exp.execStatus.started"
                  - $.exp.execStatus.ready
                parts:
                  - status:
                      tone: warn
                      text: t:rsi.exp.dagReadyWaitFirst
                  - text: $.exp.execStatus.schedule
                    when: $.exp.execStatus.schedule
              - type: kv
                when: $.exp.execStatus.started
                from:
                  - k: t:rsi.exp.now.version
                    v:
                      t: rsi.exp.now.versionOf
                      args:
                        - $.exp.execStatus.version
                        - $.exp.execStatus.change
                  - k: t:rsi.exp.execStatusMetric
                    v: $.exp.execStatus.metricVersion
                  - k: t:rsi.exp.execStatusRounds
                    v:
                      t: rsi.exp.execStatusRoundsOf
                      args:
                        - $.exp.execStatus.roundsCount
          - type: notice
            when:
              of: $.exp.next.k
              map:
                decide: true
                stale: true
                cancelled: true
                interrupted: true
                done: true
                paused: true
                _: false
            tone:
              of: $.exp.next.k
              map:
                decide: warn
                stale: warn
                cancelled: warn
                interrupted: warn
                _: info
            text:
              t: rsi.exp.next
              args:
                - $.exp.next.k
                - $.exp.next.v
                - $.exp.next.n
                - $.exp.next.count
                - $.exp.next.window
                - of: $.exp.next.k
                  map:
                    init:
                      t: rsi.exp.doingOf
                      args:
                        - $.exp.next.by.0.who
                        - $.exp.next.by.0.i
                    _: $.exp.next.by
                - $.exp.next.hint
                - of: $.exp.next.by.1.i
                  gte: 1
                  map:
                    "true":
                      t: rsi.exp.doingAlso
                      args:
                        - $.exp.next.by.1.who
                        - $.exp.next.by.1.i
                    _: ""
            action:
              type: stack
              items:
                - type: button
                  label: t:rsi.now.locate
                  act: plugSet
                  args:
                    k: selO
                    also:
                      expSec: execute
                      tab: version
                    v:
                      of: $.exp.next.go
                      slice:
                        - 8
                  when: $.exp.next.go
                - type: button
                  label: t:rsi.exp.continueAfterDone
                  act: plugin
                  args:
                    request: prep
                    id: $.exp.next.stop
                    op: edit
                  disabled: $.pending
                  when:
                    of: $.exp.next.k
                    map:
                      done: true
                      _: false
          - type: list
            from: $.exp.progress.blockers
            row:
              layout: line
              key: "@code"
              title:
                text:
                  t: rsi.progress
                  args:
                    - "@code"
                    - of: "@code"
                      map:
                        reservedSeeds:
                          t: rsi.reservedIssue
                          args:
                            - "@reason"
                            - "@detail"
                        _: "@detail"
          - type: notice
            when: $.exp.lastAbort
            tone: warn
            text:
              t: rsi.abort.summary
              args:
                - $.exp.lastAbort.cycle
                - of: $.exp.lastAbort.reason
                  map:
                    budget: t:rsi.abort.budget
                    env: t:rsi.abort.env
                    eliminated: t:rsi.abort.eliminated
                    manual: t:rsi.abort.manual
                - $.exp.lastAbort.note
          - type: list
            from: $.exp.lastAbort.cleanup
            row:
              layout: two
              key: "@run"
              title:
                text: "@run"
              sub:
                text:
                  of: "@status"
                  map:
                    pending: t:rsi.abort.pending
                    cancelled: t:rsi.abort.cancelled
                    notSubmitted: t:rsi.abort.notSubmitted
                    localStopped: t:rsi.abort.localStopped
                    failed: t:rsi.abort.failed
                    unconfirmed: t:rsi.abort.unconfirmed
          - type: section
            title: t:rsi.exp.sec.closeoutReport
            when: $.exp.closeoutReport
            blocks:
              - type: markdown
                text: $.exp.closeoutReport.markdown
          - type: section
            title: t:rsi.exp.sec.analysis
            blocks:
              - type: component
                use: plugin:official.rsi/rsiInitDag
                props:
                  from: $.exp.prep.dagNodes
                  act: plugSet
                  args:
                    k: initStep
                    v: "@k"
                  terminalTitle: t:rsi.exp.dagReady
                  title:
                    t: rsi.exp.initStep
                    args:
                      - "@i"
                      - t: rsi.exp.init
                        args:
                          - "@k"
                  stages:
                    waiting: t:rsi.exp.dagStage.waiting
                    running: t:rsi.exp.dagStage.running
                    pending: t:rsi.exp.dagStage.pending
                    done: t:rsi.exp.dagStage.done
                    error: t:rsi.exp.dagStage.error
              - type: box
                variant: expand
                when: $.exp.prep.ready.selected
                blocks:
                  - type: toolbar
                    left:
                      - type: text
                        parts:
                          - text: t:rsi.exp.dagReady
                          - status:
                              of: $.exp.prep.ready.stage
                              map:
                                done:
                                  tone: ok
                                  text: t:rsi.exp.dagStage.done
                                pending:
                                  tone: warn
                                  text: t:rsi.exp.dagReadyWaitFirst
                                _:
                                  tone: ""
                                  text: t:rsi.exp.dagStage.waiting
                    right:
                      - type: button
                        primary: true
                        label: t:rsi.exp.triggerNow
                        act: plugin
                        args:
                          request: runCycle
                          objective: $.exp.id
                        when: $.exp.prep.ready.canTriggerNow
                        disabled: $.pending
                      - type: button
                        primary: true
                        label: t:rsi.life.start
                        act: plugin
                        args:
                          request: life
                          op: start
                        when:
                          - $.exp.prep.ready.canStart
                          - "!$.exp.prep.ready.canTriggerNow"
                        disabled: $.pending
                      - type: button
                        label: t:rsi.exp.startScheduled
                        act: plugin
                        args:
                          request: life
                          op: start
                        when:
                          - $.exp.prep.ready.canStart
                          - $.exp.prep.ready.canTriggerNow
                        disabled: $.pending
                  - type: kv
                    from:
                      - k: t:rsi.exp.dagReadyProgress
                        v:
                          t: rsi.exp.dagReadyProgressOf
                          args:
                            - $.exp.prep.ready.doneCount
                            - $.exp.prep.ready.totalCount
                      - k: t:rsi.exp.dagReadyRemain
                        v:
                          t: rsi.exp.dagReadyRemainOf
                          args:
                            - $.exp.prep.ready.remaining
                        when: $.exp.prep.ready.remaining
                      - k: t:rsi.exp.dagReadySchedule
                        v: $.exp.prep.ready.schedule
                        when: $.exp.prep.ready.schedule
                      - k: t:rsi.exp.dagReadySchedule
                        v: t:rsi.exp.pol.scheduleUnset
                        when: "!$.exp.prep.ready.schedule"
                      - k: t:rsi.exp.pol.maxRuns
                        v: $.exp.prep.ready.maxRunsText
                  - type: label
                    text: t:rsi.exp.readyOverviewTitle
                    help: t:rsi.exp.readyOverviewHint
                    when: $.exp.prep.ready.overview
                  - type: each
                    from: $.exp.prep.ready.overview
                    blocks:
                      - type: box
                        blocks:
                          - type: label
                            text: "@title"
                          - type: kv
                            from: "@items"
              - type: each
                from: $.exp.prep.visibleSteps
                blocks:
                  - type: box
                    variant: expand
                    blocks:
                      - type: toolbar
                        left:
                          - type: text
                            parts:
                              - text:
                                  t: rsi.exp.initStep
                                  args:
                                    - "@i"
                                    - t: rsi.exp.init
                                      args:
                                        - "@k"
                              - status:
                                  of: "@state"
                                  map:
                                    confirmed:
                                      tone: ok
                                      text: t:rsi.exp.prep.state.confirmed
                                    preparing:
                                      tone: info
                                      text: t:rsi.exp.prep.state.preparing
                                    submitted:
                                      tone: warn
                                      text: t:rsi.exp.prep.state.submitted
                                    cancelled:
                                      tone: danger
                                      text: t:rsi.exp.prep.state.cancelled
                                    failed:
                                      tone: danger
                                      text: t:rsi.exp.prep.state.failed
                                    blocked:
                                      tone: danger
                                      text: t:rsi.exp.prep.state.blocked
                                    missing:
                                      tone: danger
                                      text: t:rsi.exp.prep.state.missing
                                    stale:
                                      tone: warn
                                      text: t:rsi.exp.prep.state.stale
                                    waiting:
                                      tone: ""
                                      text: t:rsi.exp.prep.state.waiting
                                    queued:
                                      tone: ""
                                      text: t:rsi.exp.prep.state.queued
                                    _:
                                      tone: ""
                                      text: t:rsi.exp.prep.state.uninvestigated
                        right:
                          - type: button
                            label: t:rsi.exp.stepRefresh
                            act: plugin
                            args:
                              request: initStepRefresh
                              k: "@k"
                            when: "@canRefresh"
                            disabled: $.pending
                          - type: button
                            label: t:rsi.exp.retry
                            act: plugin
                            args:
                              request: initRetry
                              k: "@k"
                            when:
                              of: "@state"
                              map:
                                _: false
                                cancelled: true
                                failed: true
                                blocked: true
                                missing: true
                            disabled: $.pending
                          - type: button
                            label: t:rsi.exp.wakeAgain
                            act: plugin
                            args:
                              request: initRetry
                              k: "@k"
                              force: "true"
                            when:
                              of: "@state"
                              map:
                                _: false
                                preparing: true
                            disabled: $.pending
                      - type: settings
                        rows:
                          - label: t:rsi.exp.stepMemberLabel
                            when: $.exp.projectPath
                            control:
                              type: select
                              id: rsi-step-member
                              label: t:rsi.exp.stepMemberLabel
                              value: "@ownerCatId"
                              options:
                                - from: $.members.rows
                                  item:
                                    v: "@id"
                                    label:
                                      t: rsi.memberOption
                                      args:
                                        - "@name"
                                        - "@handle"
                                    when: "@on"
                              change: plugin
                              args:
                                request: stepMember
                                objective: $.exp.id
                                k: "@k"
                                cats: $.members.rows
                          - label: t:rsi.exp.stepRevLabel
                            when: "@hasHistory"
                            control:
                              type: select
                              id: rsi-step-rev
                              label: t:rsi.exp.stepRevLabel
                              value: "@selectedRev"
                              options:
                                - from: "@revOptions"
                                  item:
                                    v: "@v"
                                    label: "@label"
                              change: plugSet
                              args:
                                k: initRev
                      - type: kv
                        when: "@deps"
                        from:
                          - k: t:rsi.exp.stepDepsLabel
                            v:
                              t: rsi.exp.depsOf
                              args:
                                - "@deps"
                          - k: t:rsi.exp.stepWaitLabel
                            v:
                              t: rsi.exp.waitOnOf
                              args:
                                - "@waitOn"
                            when: "@waitOn"
                      - type: notice
                        tone: info
                        text: t:rsi.exp.stepViewingOld
                        when: "@viewingOld"
                      - type: notice
                        tone: danger
                        text: "@reason"
                        when: "@reason"
                      - type: list
                        id: rsi-exp-prep
                        from: "@items"
                        row: rsi.prep
                      - type: notice
                        tone: warn
                        strong: t:rsi.exp.stepUnknownsLabel
                        items: "@unknownList"
                        when:
                          - "@unknownList"
                          - of: "@stage"
                            map:
                              done: false
                              _: true
                        action:
                          type: stack
                          items:
                            - type: button
                              label: t:rsi.exp.stepRefresh
                              act: plugin
                              args:
                                request: initStepRefresh
                                k: "@k"
                              when: "@canRefresh"
                              disabled: $.pending
                      - type: notice
                        tone: info
                        strong: t:rsi.exp.stepNextLabel
                        items: "@nextList"
                        when:
                          - "@nextList"
                          - of: "@stage"
                            map:
                              done: false
                              _: true
          - type: section
            title: t:rsi.exp.sec.execStages
            blocks:
              - type: component
                use: plugin:official.rsi/rsiLineage
                props:
                  from: $.exp.execFlow.rows
                  key: "@key"
                  parent: "@parentKey"
                  node:
                    label:
                      - text: "@id"
                    state: "@nodeState"
                    pressed: "@nodeSelected"
                    act: plugSet
                    args:
                      k: execStage
                      v: "@pick"
                  cells:
                    - type: each
                      from: "@steps"
                      control:
                        type: chip
                        label:
                          t: rsi.exp.execStageTitle
                          args:
                            - "@k"
                        faint: "@faint"
                        pressed: "@selected"
                        act: plugSet
                        args:
                          k: execStage
                          v: "@pick"
              - type: box
                variant: expand
                blocks:
                  - type: kv
                    from:
                      - k: t:rsi.exp.execStageMeaningLabel
                        v:
                          t: rsi.exp.execStageDesc
                          args:
                            - $.exp.execFlow.selected.k
                  - type: settings
                    when: $.exp.execFlow.selected.isAutoStage
                    rows:
                      - label: t:rsi.exp.execStageRunnerLabel
                        control:
                          type: text
                          variant: value
                          text:
                            t: rsi.exp.execStageCollectVal
                            args:
                              - $.exp.execFlow.selected.executorMcp
                              - t: rsi.exp.exState
                                args:
                                  - $.exp.execFlow.selected.executorState
                  - type: settings
                    when:
                      - $.exp.projectPath
                      - $.exp.execFlow.selected.memberStage
                    rows:
                      - label: t:rsi.exp.stepMemberLabel
                        help: t:rsi.exp.execStageMemberHelp
                        control:
                          type: select
                          id: rsi-exec-stage-member
                          label: t:rsi.exp.stepMemberLabel
                          value: $.exp.execFlow.selected.memberStage.value
                          options:
                            - from: $.members.rows
                              item:
                                v: "@id"
                                label:
                                  t: rsi.memberOption
                                  args:
                                    - "@name"
                                    - "@handle"
                                when: "@on"
                          change: plugin
                          args:
                            request: memberRole
                            objective: $.exp.id
                            role: $.exp.execFlow.selected.memberStage.role
                            cats: $.members.rows
                  - type: view
                    id: rsi.discussMembers
                    when:
                      - $.exp.projectPath
                      - $.exp.execFlow.selected.isDiscuss
                  - type: text
                    variant: meta
                    text: t:rsi.exp.execStageMemberHelp
                    when:
                      - $.exp.projectPath
                      - $.exp.execFlow.selected.isDiscuss
          - type: section
            title: t:rsi.exp.sec.execPolicy
            actions:
              - type: button
                icon: plus
                label: t:rsi.exp.pol.addPolicy
                act: plugin
                args:
                  request: policyEditOpen
                  objective: $.exp.id
            blocks:
              - type: list
                id: rsi-policies
                from: $.exp.policy.schedule.policies
                empty: t:rsi.exp.pol.policyEmpty
                row:
                  layout: two
                  key: "@id"
                  title: "@title"
                  sub: "@sub"
                  act: plugin
                  args:
                    request: policyEditOpen
                    objective: $.exp.id
                    policyId: "@id"
                  acts:
                    - icon: delete
                      label: t:rsi.common.delete
                      act: plugin
                      args:
                        request: policyDelete
                        objective: $.exp.id
                        policyId: "@id"
              - type: notice
                tone: info
                strong: t:rsi.exp.pol.nextRunsTitle
                items: $.exp.policy.schedule.nextRuns
                when: $.exp.policy.schedule.nextRuns
              - type: settings
                rows:
                  - label: t:rsi.exp.pol.maxRuns
                    control:
                      type: select
                      id: rsi-pol-max-runs
                      label: t:rsi.exp.pol.maxRuns
                      value: $.exp.policy.schedule.maxRunsValue
                      options:
                        - v: ""
                          label: t:rsi.exp.pol.unlimited
                        - v: "1"
                          label: t:rsi.exp.pol.runs1
                        - v: "2"
                          label: t:rsi.exp.pol.runs2
                        - v: "3"
                          label: t:rsi.exp.pol.runs3
                        - v: "5"
                          label: t:rsi.exp.pol.runs5
                        - v: "10"
                          label: t:rsi.exp.pol.runs10
                      change: plugin
                      args:
                        request: maxRuns
                        objective: $.exp.id
          - type: section
            title: t:rsi.exp.sec.approvalPolicy
            blocks:
              - type: settings
                when: $.exp.projectPath
                rows:
                  - label: t:rsi.exp.pol.auto
                    control:
                      type: select
                      id: rsi-pol-auto
                      label: t:rsi.exp.pol.auto
                      value: $.exp.policy.autoKey
                      options:
                        - v: default
                          label: t:rsi.newExp.autoDefault
                        - v: execution
                          label: t:rsi.newExp.autoExecution
                        - v: none
                          label: t:rsi.newExp.autoNone
                      change: plugin
                      args:
                        request: autoInline
                        objective: $.exp.id
                  - label: t:rsi.exp.pol.repair
                    control:
                      type: select
                      id: rsi-pol-repair
                      label: t:rsi.exp.pol.repair
                      value: $.exp.policy.repairValue
                      options:
                        - v: "0"
                          label: t:rsi.exp.pol.repair0
                        - v: "1"
                          label: t:rsi.exp.pol.repair1
                        - v: "3"
                          label: t:rsi.exp.pol.repair3
                        - v: "5"
                          label: t:rsi.exp.pol.repair5
                        - v: "10"
                          label: t:rsi.exp.pol.repair10
                      change: plugin
                      args:
                        request: repairInline
                        objective: $.exp.id
                  - label: t:rsi.exp.pol.manager
                    control:
                      type: select
                      id: rsi-pol-manager
                      label: t:rsi.exp.pol.manager
                      value: $.exp.policy.managerId
                      options:
                        - v: ""
                          label: t:rsi.exp.pol.managerNone
                        - from: $.members.rows
                          item:
                            v: "@id"
                            label:
                              t: rsi.memberOption
                              args:
                                - "@name"
                                - "@handle"
                            when: "@on"
                      change: plugin
                      args:
                        request: managerInline
                        objective: $.exp.id
                        cats: $.members.rows
                  - label: t:rsi.exp.pol.requireCycleVars
                    control:
                      type: select
                      id: rsi-pol-require-cycle-vars
                      label: t:rsi.exp.pol.requireCycleVars
                      value: $.exp.policy.requireCycleVarsValue
                      options:
                        - v: "off"
                          label: t:rsi.exp.pol.requireCycleVarsOff
                        - v: "on"
                          label: t:rsi.exp.pol.requireCycleVarsOn
                      change: plugin
                      args:
                        request: requireCycleVarsInline
                        objective: $.exp.id
              - type: settings
                when: "!$.exp.projectPath"
                rows:
                  - label: t:rsi.exp.pol.auto
                    control:
                      type: text
                      variant: value
                      text: $.exp.policy.autoText
          - type: section
            title: t:rsi.exp.sec.stopPolicy
            when: $.exp.projectPath
            blocks:
              - type: settings
                rows:
                  - label: t:rsi.newExp.stopTarget
                    control:
                      type: input
                      id: rsi-pol-stop-target
                      label: t:rsi.newExp.stopTarget
                      value: $.exp.policy.stopTarget
                      placeholder: t:rsi.exp.pol.stopTargetPlaceholder
                      change: plugin
                      args:
                        request: stopInline
                        objective: $.exp.id
                        field: target
                  - label: t:rsi.newExp.stopRounds
                    control:
                      type: select
                      id: rsi-pol-stop-rounds
                      label: t:rsi.newExp.stopRounds
                      value: $.exp.policy.stopRoundsValue
                      options:
                        - v: ""
                          label: t:rsi.exp.pol.unlimited
                        - v: "3"
                          label: t:rsi.exp.pol.rounds3
                        - v: "5"
                          label: t:rsi.exp.pol.rounds5
                        - v: "10"
                          label: t:rsi.exp.pol.rounds10
                        - v: "20"
                          label: t:rsi.exp.pol.rounds20
                        - v: "50"
                          label: t:rsi.exp.pol.rounds50
                      change: plugin
                      args:
                        request: stopInline
                        objective: $.exp.id
                        field: rounds
      - type: each
        from:
          - {}
        when:
          of: $.exp.section
          map:
            execute: true
            _: false
        blocks:
          - type: empty
            icon: bolt
            text: t:rsi.exp.noRoundsYet
            when: "!$.exp.hasRounds"
            action:
              type: button
              primary: true
              label: t:rsi.exp.goManage
              act: plugSet
              args:
                k: expSec
                v: manage
                also:
                  initStep: ready
          - type: each
            from:
              - {}
            when: $.exp.hasRounds
            blocks:
              - type: toolbar
                left:
                  - type: text
                    when: $.exp.activeTrend
                    parts:
                      - text:
                          t: rsi.exp.trend
                          args:
                            - $.exp.activeTrend.name
                            - $.exp.hitRate.hit
                            - $.exp.hitRate.all
                right:
                  - type: button
                    label: t:rsi.exp.overviewMap
                    when: $.exp.overviewMap.nodes.length
                    act: dialog
                    args:
                      kind: rsiMap
                      title: $.exp.name
                  - type: select
                    id: rsi-trend-pick
                    label: t:rsi.exp.trendPick
                    when: $.exp.trendOptions.length
                    value: $.exp.activeTrendId
                    change: plugSet
                    args:
                      k: trendMetric
                    options:
                      - from: $.exp.trendOptions
                        item:
                          v: "@v"
                          label: "@label"
              - type: component
                when: $.exp.activeTrend
                use: plugin:official.rsi/rsiTrend
                props:
                  series: $.exp.activeTrend
                  from: $.exp.trend
                  label: t:rsi.exp.trendLabel
          - type: toolbar
            when: $.exp.hasRounds
            items:
              - type: seg
                value: $.exp.tab
                options:
                  - v: version
                    label: t:rsi.tab.version
                  - v: metrics
                    label: t:rsi.tab.metrics
                  - v: collect
                    label: t:rsi.tab.collect
                act: plugSet
                args:
                  k: tab
      - type: each
        from:
          - {}
        when:
          - of: $.exp.section
            map:
              execute: true
              _: false
          - $.exp.hasRounds
          - of: $.exp.tab
            map:
              _: false
              version: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.exp.versions
              key: "@key"
              parent: "@parentKey"
              node:
                label:
                  - text: "@id"
                state: "@nodeState"
                pressed: "@nodeSelected"
                act: plugSet
                args:
                  k: selO
                  v: "@pick"
              cells:
                - type: select
                  when: "@cyclePick"
                  id: "@cyclePick.id"
                  label: t:rsi.cycle.pick
                  change: plugSet
                  args:
                    k:
                      of: "@cyclePick.tree"
                      map:
                        rsiSelO: selO
                        rsiSelE: selE
                        rsiSelC: selC
                  value: "@cyclePick.value"
                  options:
                    - from: "@cyclePick.options"
                      item:
                        v: "@v"
                        label:
                          t: rsi.cycle.nOf
                          args:
                            - "@n"
                            - "@total"
                - type: each
                  from: "@steps"
                  control:
                    type: chip
                    label:
                      of: "@k"
                      map:
                        prep:
                          t: rsi.step.prep
                          args:
                            - t: rsi.prepResult
                              args:
                                - "@result"
                        apply:
                          t: rsi.step.apply
                          args:
                            - t: rsi.applyResult
                              args:
                                - "@result"
                        collect:
                          of: "@live"
                          map:
                            "true":
                              t: rsi.step.collectLive
                              args:
                                - "@n"
                            _:
                              t: rsi.step.collect
                              args:
                                - "@n"
                        eval:
                          t: rsi.step.eval
                          args:
                            - "@n"
                            - t: rsi.evalResult
                              args:
                                - "@result"
                        discuss:
                          t: rsi.step.discuss
                          args:
                            - "@n"
                            - of: "@resolved"
                              map:
                                "true":
                                  of: "@result"
                                  map:
                                    split: t:rsi.discussResult.resolved
                                    _:
                                      t: rsi.discussResult
                                      args:
                                        - "@result"
                                        - "@count"
                                _:
                                  t: rsi.discussResult
                                  args:
                                    - "@result"
                                    - "@count"
                        gov:
                          t: rsi.step.gov
                          args:
                            - t: rsi.govResult
                              args:
                                - "@result"
                        cycles:
                          t: rsi.step.cycles
                          args:
                            - "@count"
                    faint:
                      of: "@k"
                      map:
                        prep: "@owner"
                        collect:
                          of: "@live"
                          map:
                            "true":
                              t: rsi.step.doneOf
                              args:
                                - "@done"
                                - "@total"
                            _: ""
                        eval: "@delta"
                        discuss:
                          of: "@result"
                          map:
                            proposing:
                              t: rsi.step.doneOf
                              args:
                                - "@done"
                                - "@asked"
                            _:
                              of: "@missing"
                              gte: 1
                              map:
                                "true":
                                  t: rsi.step.missingOf
                                  args:
                                    - "@missing"
                                _: ""
                        _: ""
                    pressed: "@selected"
                    tone:
                      of: "@resolved"
                      map:
                        "true": ""
                        _:
                          of: "@result"
                          map:
                            pending: warn
                            unclaimed: warn
                            repairing: warn
                            rollback: warn
                            failed: warn
                            split: warn
                            _: ""
                    act: plugSet
                    args:
                      k: selO
                      v: "@pick"
          - type: section
            title:
              of: $.exp.step
              map:
                node: $.exp.ver.id
                prep:
                  t: rsi.detail.prep
                  args:
                    - $.exp.ver.id
                _:
                  t: rsi.detail.step
                  args:
                    - $.exp.ver.id
                    - $.exp.cycle.k
                    - t: rsi.stepName
                      args:
                        - $.exp.step
            blocks:
              - type: each
                from:
                  - {}
                when: $.exp.prepStage
                blocks:
                  - type: notice
                    tone: info
                    text:
                      of: $.exp.prepStage.status
                      map:
                        claimed:
                          t: rsi.ov.basisPreparingClaimed
                          args:
                            - $.exp.prepStage.ownerName
                        unclaimed:
                          t: rsi.ov.basisPreparingWaiting
                          args:
                            - $.exp.prepStage.ownerName
                        _: t:rsi.exp.prepStageQueued
                    action:
                      type: button
                      label: t:rsi.exp.retryStage
                      when: $.exp.prepStage.canWake
                      act: plugin
                      args:
                        request: versionAgain
                      disabled: $.pending
                  - type: kv
                    from:
                      - k: t:rsi.detail.state
                        v:
                          t: rsi.prepResult
                          args:
                            - $.exp.prepStage.status
                      - k: t:rsi.exp.stepMemberLabel
                        v: $.exp.prepStage.ownerName
                        when: $.exp.prepStage.ownerName
                      - k: t:rsi.detail.parent
                        v: $.exp.prepStage.parent
                        when: $.exp.prepStage.parent
                      - k: t:rsi.exp.prepStageTrigger
                        v:
                          of: $.exp.prepStage.repair
                          map:
                            "true":
                              t: rsi.exp.prepStageTriggerRepair
                              args:
                                - $.exp.prepStage.triggerCycle
                            _:
                              t: rsi.exp.prepStageTriggerDir
                              args:
                                - $.exp.prepStage.triggerCycle
                        when: $.exp.prepStage.triggerCycle
                      - k: t:rsi.detail.change
                        v: $.exp.prepStage.change
                        when: $.exp.prepStage.change
                      - k: t:rsi.detail.commit
                        v: $.exp.prepStage.commitShort
                        when: $.exp.prepStage.commitShort
                      - k: t:rsi.detail.at
                        v:
                          of: $.exp.prepStage.at
                          fmt: stamp
                        when: $.exp.prepStage.at
              - type: kv
                when:
                  of: $.exp.step
                  map:
                    _: false
                    node: true
                from:
                  - k: t:rsi.detail.state
                    v:
                      of: $.exp.ver.outcome
                      map:
                        current: t:rsi.ov.stCurrent
                        confirmed: t:rsi.ov.stConfirmed
                        running: t:rsi.ov.stRunning
                        preparing: t:rsi.ov.stPreparing
                        pruned: t:rsi.ov.stPruned
                        deadEnd: t:rsi.ov.stDeadEnd
                        guardrail: t:rsi.ov.stGuardrail
                        worse: t:rsi.ov.stWorse
                        tied: t:rsi.ov.stTied
                        insufficient: t:rsi.ov.stInsufficient
                        repaired: t:rsi.ov.stRepaired
                        baseline: t:rsi.ov.stBaseline
                        candidate: t:rsi.ov.stCandidate
                        explored: t:rsi.ov.stExplore
                        _: ""
                    when: $.exp.ver.outcome
                  - k: t:rsi.exp.stepMemberLabel
                    v: $.exp.ver.ownerName
                    when:
                      - $.exp.ver.preparing
                      - $.exp.ver.ownerName
                  - k: t:rsi.detail.aspect
                    v:
                      of: $.exp.ver.aspects
                      sep: " · "
                      item:
                        of: "@"
                        map:
                          object: t:rsi.ov.obj
                          observability: t:rsi.ov.obs
                          rubric: t:rsi.ov.rub
                          _: "@"
                    when: $.exp.ver.aspects.length
                  - k: t:rsi.detail.aspect
                    v:
                      of: $.exp.ver.aspectKind
                      map:
                        baseline: t:rsi.ov.baseline
                        _: t:rsi.ov.unlabeled
                    when: "!$.exp.ver.aspects.length"
                  - k: t:rsi.detail.change
                    v: $.exp.ver.change
                  - k: t:rsi.detail.pruneReason
                    v: $.exp.ver.pruneReason
                    when:
                      - $.exp.ver.pruned
                      - $.exp.ver.pruneReason
                  - k: t:rsi.detail.parent
                    v: $.exp.ver.parent
                    when: $.exp.ver.parent
                  - k: t:rsi.detail.metricVersion
                    v: $.exp.ver.metricVersion
                    when: $.exp.ver.metricVersion
                  - k: t:rsi.detail.commit
                    v: $.exp.ver.commitShort
                    when: $.exp.ver.commitShort
                  - k: t:rsi.exp.pr
                    v: $.exp.ver.pr
                    when: $.exp.ver.pr
                  - k: t:rsi.detail.at
                    v:
                      of: $.exp.ver.at
                      fmt: stamp
                    when: $.exp.ver.at
              - type: each
                from:
                  - {}
                when: $.exp.cycle.stage
                blocks:
                  - type: settings
                    when:
                      - $.exp.cycle.stage.canEdit
                      - "!$.exp.cycle.stage.multi"
                    rows:
                      - label: t:rsi.exp.stepMemberLabel
                        help: t:rsi.exp.execStageMemberHelp
                        control:
                          type: select
                          id: rsi-cycle-stage-member
                          label: t:rsi.exp.stepMemberLabel
                          value: $.exp.cycle.stage.value
                          options:
                            - from: $.members.rows
                              item:
                                v: "@id"
                                label:
                                  t: rsi.memberOption
                                  args:
                                    - "@name"
                                    - "@handle"
                                when: "@on"
                          change: plugin
                          args:
                            request: memberRole
                            objective: $.exp.id
                            role: $.exp.cycle.stage.role
                            cats: $.members.rows
                  - type: view
                    id: rsi.discussMembers
                    when:
                      - $.exp.cycle.stage.canEdit
                      - $.exp.cycle.stage.multi
                  - type: text
                    variant: meta
                    text: t:rsi.exp.execStageMemberHelp
                    when:
                      - $.exp.cycle.stage.canEdit
                      - $.exp.cycle.stage.multi
                  - type: text
                    variant: meta
                    when:
                      - "!$.exp.cycle.stage.canEdit"
                      - $.exp.cycle.stage.ownerNames
                    text:
                      t: rsi.exp.stageOwnerOf
                      args:
                        - of: $.exp.cycle.stage.archived
                          map:
                            "true": t:rsi.exp.stageOwnerArchived
                            _: t:rsi.exp.stageOwnerUpcoming
                        - $.exp.cycle.stage.ownerNames
              - type: each
                from:
                  - {}
                when:
                  of: $.exp.step
                  map:
                    _: false
                    apply: true
                blocks:
                  - type: kv
                    from:
                      - k: t:rsi.exp.plan.by
                        v:
                          t: rsi.exp.planBy
                          args:
                            - $.exp.cycle.plan.by
                      - k: t:rsi.exp.plan.seeds
                        v:
                          of: $.exp.cycle.plan.seeds
                          sep: " "
                      - k: t:rsi.exp.plan.window
                        v: $.exp.cycle.plan.window
                  - type: list
                    id: rsi-exp-plan
                    label: t:rsi.exp.groups
                    from: $.exp.cycle.groups
                    expand: many
                    row:
                      layout: two
                      key: "@id"
                      title: "@shortTitle"
                      inline:
                        - chip: t:rsi.exp.control
                          when: "@control"
                        - chip: t:rsi.exp.confirm
                          when: "@confirm"
                        - text: "@version"
                          variant: badge
                        - text: "@versionCommit"
                          mono: true
                          when: "@versionCommit"
                      sub:
                        sep: " · "
                        parts:
                          - text: "@configSummary"
                            mono: true
                            when: "@configSummary"
                          - text: "@varsText"
                            mono: true
                            when:
                              - "!@configSummary"
                              - "@varsText"
                      cols:
                        - v:
                            text:
                              t: rsi.exp.doneOf
                              args:
                                - "@doneN"
                                - "@total"
                            num: true
                          w: label
                        - v:
                            text:
                              t: rsi.exp.failedOf
                              args:
                                - "@failed"
                            tone: danger
                          w: label
                          when: "@failed"
                      expand:
                        - type: kv
                          from:
                            - k: t:rsi.exp.groupChange
                              v: "@fullDesc"
                              when: "@fullDesc"
                            - k: t:rsi.detail.change
                              v: "@versionChange"
                              when: "@versionChange"
                        - type: label
                          text: t:rsi.exp.groupConfig
                          when: "@configEntries.length"
                        - type: kv
                          from: "@configEntries"
                          when: "@configEntries.length"
                        - type: label
                          text: t:rsi.exp.groupCmd
                          when: "@sampleCommand"
                        - type: pre
                          text: "@sampleCommand"
                          when: "@sampleCommand"
              - type: each
                from:
                  - {}
                when:
                  of: $.exp.step
                  map:
                    _: false
                    collect: true
                blocks:
                  - type: notice
                    tone: info
                    when: $.exp.cycle.collectSummary.concludedHeadline
                    text:
                      t: rsi.exp.collectConcluded
                      args:
                        - $.exp.cycle.collectSummary.concludedHeadline
                  - type: kv
                    when: $.exp.cycle.collectSummary
                    from:
                      - k: t:rsi.ov.ckTier
                        v:
                          of: $.exp.cycle.collectSummary.tier
                          map:
                            explore: t:rsi.ov.tierExplore
                            baseline: t:rsi.ov.tierBaseline
                            _: t:rsi.ov.tierConfirm
                      - k: t:rsi.ov.ckMetricVersion
                        v: $.exp.cycle.collectSummary.metricVersion
                        when: $.exp.cycle.collectSummary.metricVersion
                      - k: t:rsi.ov.ckSeeds
                        v: $.exp.cycle.collectSummary.seedsText
                        when: $.exp.cycle.collectSummary.seedsText
                      - k: t:rsi.exp.collectProgress
                        v: $.exp.cycle.collectSummary.progressText
                        when: $.exp.cycle.collectSummary.progressText
                  - type: list
                    id: rsi-exp-events
                    label: t:rsi.exp.events
                    from: $.exp.cycle.events
                    optional: true
                    row:
                      layout: two
                      title: "@text"
                      sub:
                        text:
                          t: rsi.exp.event
                          args:
                            - "@kind"
                      cols:
                        - v:
                            text:
                              of: "@at"
                              fmt: stamp
                          w: time
                  - type: each
                    from: $.exp.cycle.groups
                    blocks:
                      - type: list
                        id: "@runListId"
                        label:
                          t: rsi.exp.groupHead
                          args:
                            - "@shortTitle"
                            - "@version"
                            - "@doneN"
                            - "@total"
                        from: "@runs"
                        expand: many
                        row:
                          layout: two
                          key: "@id"
                          title: "@roundTitle"
                          inline:
                            - text: "@seedText"
                              variant: badge
                          sub:
                            sep: " · "
                            parts:
                              - text: "@commitShort"
                                mono: true
                                when: "@commitShort"
                              - text: "@jobId"
                                mono: true
                                when: "@jobId"
                              - text: "@env.hw"
                                when: "@env.hw"
                              - text: "@durationText"
                                mono: true
                                when: "@durationText"
                              - text:
                                  t: rsi.exp.retries
                                  args:
                                    - "@retries"
                                when: "@retries"
