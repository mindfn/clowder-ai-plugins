        text: t:rsi.caps.none
        when: "!$.caps.listed"
        action:
          type: each
          from: $.home.projects
          control:
            type: stack
            when:
              - of: "@id"
                gte: $.home.projectId
              - of: $.home.projectId
                gte: "@id"
            items:
              - type: button
                primary: true
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNewExp
                  thread: $.currentThread.id
                  project: $.home.projectId
                  cats: $.members.rows
                disabled: $.pending
                when: "@exp"
              - type: button
                primary: true
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNew
                disabled: $.pending
                when: "!@exp"
      - type: text
        variant: meta
        when: $.caps.analysis
        text:
          t: rsi.caps.at
          args:
            - of: $.caps.analysis.at
              fmt: stamp
            - $.caps.analysis.by
      - type: list
        id: rsi-modify
        label: t:rsi.caps.modify
        optional: true
        from: $.caps.modify
        row: rsi.group
      - type: list
        id: rsi-collect
        label: t:rsi.caps.collect
        optional: true
        from: $.caps.collect
        row: rsi.group
      - type: list
        id: rsi-env
        label: t:rsi.caps.env
        optional: true
        from: $.caps.env
        row: rsi.group
    sources:
      caps: caps
      home: home
      members: host:members
      currentThread: host:currentThread
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.library:
    blocks:
      - type: head
        variant: detail
        title: t:rsi.nav.library
        help: t:rsi.library.help
        actions:
          - type: button
            label: t:rsi.library.add
            act: dialog
            when: $.library.analysis
            args:
              kind: rsiDocAdd
            disabled: $.pending
      - type: empty
        icon: search
        text: t:rsi.library.none
        when: "!$.library.docs"
        action:
          type: each
          from: $.home.projects
          control:
            type: stack
            when:
              - of: "@id"
                gte: $.home.projectId
              - of: $.home.projectId
                gte: "@id"
              - "!$.library.analysis"
            items:
              - type: button
                primary: true
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNewExp
                  thread: $.currentThread.id
                  project: $.home.projectId
                  cats: $.members.rows
                disabled: $.pending
                when: "@exp"
              - type: button
                primary: true
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNew
                disabled: $.pending
                when: "!@exp"
      - type: list
        id: rsi-library
        when: $.library.docs
        groups: $.library.groups
        group:
          title:
            t: rsi.library.kind
            args:
              - "@k"
        row: rsi.doc
    sources:
      library: library
      home: home
      members: host:members
      currentThread: host:currentThread
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  dlg.rsiCards:
    title: t:rsi.card.dialog
    wide: true
    blocks:
      - type: empty
        text: t:rsi.cards.none
        when: "!$.cards.cards"
      - type: each
        from: $.cards.cards
        blocks:
          - type: box
            variant: card
            blocks:
              - type: text
                variant: title
                text:
                  t: rsi.card.titleOf
                  args:
                    - "@objectiveName"
                    - "@from"
                    - "@to"
              - type: text
                variant: meta
                when:
                  of: "@round"
                  gte: 2
                text:
                  t: rsi.card.round
                  args:
                    - "@round"
              - type: label
                text: t:rsi.card.basis
              - type: text
                variant: para
                text: "@basis"
              - type: text
                variant: list
                from: "@reasons"
              - type: label
                text: t:rsi.card.proposal
              - type: list
                from: "@actions"
                row:
                  layout: line
                  key: "@unit"
                  title:
                    text:
                      of: "@op"
                      map:
                        modify:
                          t: rsi.change.modify
                          args:
                            - "@unitName"
                            - "@from"
                            - "@to"
                        add:
                          t: rsi.change.add
                          args:
                            - "@unitName"
                        remove:
                          t: rsi.change.remove
                          args:
                            - "@unitName"
                        enable:
                          t: rsi.change.enable
                          args:
                            - "@unitName"
                        disable:
                          t: rsi.change.disable
                          args:
                            - "@unitName"
                        _: "@unitName"
                  cols:
                    - v:
                        text:
                          t: rsi.card.shared
                          args:
                            - of: "@sharedNames"
                              sep: 、
                        tone: warn
                      w: label
                      when: "@sharedNames"
                    - v:
                        text:
                          t: rsi.apply
                          args:
                            - "@apply"
                      w: state
              - type: label
                text: t:rsi.card.predictions
              - type: list
                from: "@predictions"
                row:
                  layout: line
                  key: "@metric"
                  title: "@metric"
                  inline:
                    - chip: t:rsi.metric.locked
                      when: "@locked"
                    - chip: t:rsi.metric.guard
                      when: "@guard"
                  cols:
                    - v:
                        text: "@expect"
                      w: label
              - type: label
                text: t:rsi.card.collab
                when: "@collab"
              - type: text
                variant: para
                text: "@collab.text"
                when: "@collab"
              - type: toolbar
                items:
                  - type: button
                    primary: true
                    label: t:rsi.card.apply
                    act: plugin
                    args:
                      request: decide
                      card: "@id"
                      decision: apply
                    disabled: $.pending
                  - type: button
                    label: t:rsi.card.reevaluate
                    act: dialog
                    args:
                      kind: rsiReeval
                      card: "@id"
                    disabled: $.pending
                  - type: button
                    label: t:rsi.card.skip
                    act: plugin
                    args:
                      request: decide
                      card: "@id"
                      decision: skip
                    disabled: $.pending
    sources:
      cards: cards
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.cards:
    blocks:
      - type: head
        variant: detail
        title: t:rsi.nav.cards
      - type: list
        id: rsi-todo
        from: $.todo.items
        empty: t:rsi.cards.none
        row:
          layout: two
          key: "@id"
          lead:
            - glyph:
                of: "@kind"
                map:
                  card: bolt
                  stalled: alert
                  exhausted: clock
                  ready: play
                  _: bolt
          title: "@objectiveName"
          sub:
            sep: " · "
            parts:
              - text:
                  of: "@kind"
                  map:
                    card:
                      t: rsi.card.title
                      args:
                        - "@from"
                        - "@to"
                    stalled: t:rsi.todo.stalled
                    exhausted: t:rsi.todo.exhausted
                    ready: t:rsi.todo.ready
                    _: "@kind"
              - text:
                  t: rsi.card.round
                  args:
                    - "@round"
                when:
                  of: "@round"
                  gte: 2
          cols:
            - v:
                text:
                  of: "@at"
                  fmt: ago
              w: time
          acts:
            - label: t:rsi.todo.jump
              icon: hook
              act: plugin
              args:
                request: go
                objective: "@objective"
          expand:
            - type: box
              variant: card
              blocks:
                - type: text
                  variant: title
                  text:
                    t: rsi.card.titleOf
                    args:
                      - "@objectiveName"
                      - "@from"
                      - "@to"
                - type: text
                  variant: meta
                  when:
                    of: "@round"
                    gte: 2
                  text:
                    t: rsi.card.round
                    args:
                      - "@round"
                - type: label
                  text: t:rsi.card.basis
                - type: text
                  variant: para
                  text: "@basis"
                - type: text
                  variant: list
                  from: "@reasons"
                - type: label
                  text: t:rsi.card.proposal
                - type: list
                  from: "@actions"
                  row:
                    layout: line
                    key: "@unit"
                    title:
                      text:
                        of: "@op"
                        map:
                          modify:
                            t: rsi.change.modify
                            args:
                              - "@unitName"
                              - "@from"
                              - "@to"
                          add:
                            t: rsi.change.add
                            args:
                              - "@unitName"
                          remove:
                            t: rsi.change.remove
                            args:
                              - "@unitName"
                          enable:
                            t: rsi.change.enable
                            args:
                              - "@unitName"
                          disable:
                            t: rsi.change.disable
                            args:
                              - "@unitName"
                          _: "@unitName"
                    cols:
                      - v:
                          text:
                            t: rsi.card.shared
                            args:
                              - of: "@sharedNames"
                                sep: 、
                          tone: warn
                        w: label
                        when: "@sharedNames"
                      - v:
                          text:
                            t: rsi.apply
                            args:
                              - "@apply"
                        w: state
                - type: label
                  text: t:rsi.card.predictions
                - type: list
                  from: "@predictions"
                  row:
                    layout: line
                    key: "@metric"
                    title: "@metric"
                    inline:
                      - chip: t:rsi.metric.locked
                        when: "@locked"
                      - chip: t:rsi.metric.guard
                        when: "@guard"
                    cols:
                      - v:
                          text: "@expect"
                        w: label
                - type: label
                  text: t:rsi.card.collab
                  when: "@collab"
                - type: text
                  variant: para
                  text: "@collab.text"
                  when: "@collab"
                - type: toolbar
                  items:
                    - type: button
                      primary: true
                      label: t:rsi.card.apply
                      act: plugin
                      args:
                        request: decide
                        card: "@id"
                        decision: apply
                      disabled: $.pending
                    - type: button
                      label: t:rsi.card.reevaluate
                      act: dialog
                      args:
                        kind: rsiReeval
                        card: "@id"
                      disabled: $.pending
                    - type: button
                      label: t:rsi.card.skip
                      act: plugin
                      args:
                        request: decide
                        card: "@id"
                        decision: skip
                      disabled: $.pending
              when:
                of: "@kind"
                map:
                  _: false
                  card: true
            - type: notice
              tone: danger
              when:
                of: "@kind"
                map:
                  _: false
                  stalled: true
              text:
                of: "@stalledAt"
                map:
                  gov: t:rsi.stall.gov
                  _: t:rsi.stall.eval
            - type: toolbar
              when:
                of: "@kind"
                map:
                  _: false
                  stalled: true
              items:
                - type: button
                  primary: true
                  label: t:rsi.life.retry
                  act: plugin
                  args:
                    request: life
                    op: retry
                    objective: "@objective"
                  disabled: $.pending
                - type: button
                  label:
                    of: "@stalledAt"
                    map:
                      gov: t:rsi.thread.iterate
                      _: t:rsi.thread.eval
                  act: thread
                  args:
                    id: "@thread"
            - type: toolbar
              when:
                of: "@kind"
                map:
                  _: false
                  exhausted: true
              items:
                - type: button
                  label: t:rsi.life.more
                  act: plugin
                  args:
                    request: life
                    op: more
                    objective: "@objective"
                  disabled: $.pending
            - type: toolbar
              when:
                of: "@kind"
                map:
                  _: false
                  ready: true
              items:
                - type: button
                  primary: true
                  label: t:rsi.life.start
                  act: plugin
                  args:
                    request: life
                    op: start
                    objective: "@objective"
                  disabled: $.pending
    sources:
      todo: todo
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  dlg.rsiRecord:
    title: $.title
    wide: true
    blocks:
      - type: kv
        when:
          of: $.record.type
          map:
            _: false
            trace: true
        from:
          - k: t:rsi.trace.at
            v:
              of: $.record.at
              fmt: stamp
          - k: t:rsi.trace.cat
            v: $.record.cat
          - k: t:rsi.trace.where
            v:
              t: rsi.trace.whereOf
              args:
                - $.record.version
                - $.record.cycle
          - k: t:rsi.trace.c
            v: $.record.c
      - type: kv
        when:
          of: $.record.type
          map:
            _: false
            run: true
        from:
          - k: t:rsi.trace.at
            v:
              of: $.record.at
              fmt: stamp
          - k: t:rsi.run.change
            v:
              of: "@op"
              map:
                modify:
                  t: rsi.change.modify
                  args:
                    - "@unitName"
                    - "@from"
                    - "@to"
                add:
                  t: rsi.change.add
                  args:
                    - "@unitName"
                remove:
                  t: rsi.change.remove
                  args:
                    - "@unitName"
                enable:
                  t: rsi.change.enable
                  args:
                    - "@unitName"
                disable:
                  t: rsi.change.disable
                  args:
                    - "@unitName"
                _: "@unitName"
          - k: t:rsi.run.apply
            v:
              t: rsi.apply
              args:
                - $.record.apply
          - k: t:rsi.run.pr
            v: $.record.pr
            when: $.record.pr
          - k: t:rsi.run.script
            v: $.record.run
            when: $.record.run
          - k: t:rsi.run.by
            v:
              t: rsi.by
              args:
                - $.record.by
      - type: toolbar
        when: $.record.thread
        items:
          - type: button
            label: t:rsi.trace.thread
            act: thread
            args:
              id: $.record.thread
      - type: list
        id: rsi-record-results
        label:
          of: $.record.type
          map:
            run: t:rsi.run.results
            _: t:rsi.trace.results
        from: $.record.results
        empty: t:rsi.trace.noResults
        row:
          layout: line
          key: "@name"
          title: "@name"
          cols:
            - v:
                status:
                  of: "@pass"
                  map:
                    "true":
                      tone: ok
                      text: t:rsi.trace.pass
                    _:
                      tone: warn
                      text:
                        of: $.record.type
                        map:
                          run: t:rsi.run.fail
                          _: t:rsi.trace.counter
              w: state
      - type: list
        id: rsi-record-events
        label:
          of: $.record.type
          map:
            run: t:rsi.run.events
            _: t:rsi.trace.events
        from: $.record.events
        row:
          layout: two
          key: "@source"
          title: "@text"
          sub: "@source"
          cols:
            - v:
                status:
                  of: "@state"
                  map:
                    hit:
                      tone: warn
                      text: t:rsi.trace.counter
                    failed:
                      tone: danger
                      text: t:rsi.run.state.failed
                    _: ""
              w: state
              when: "@state"
            - v:
                text:
                  of: "@at"
                  fmt: hm
              w: time
          expand:
            - type: pre
              text: "@raw"
              when: "@raw"
    sources:
      record: record
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  dlg.rsiDoc:
    title: $.title
    wide: true
    blocks:
      - type: kv
        from:
          - k: t:rsi.library.from
            v:
              t: rsi.library.kind
              args:
                - $.doc.kind
          - k: t:rsi.library.path
            v: $.doc.path
            when: $.doc.path
          - k: t:rsi.library.url
            v: $.doc.url
            when: $.doc.url
          - k: t:rsi.library.byLabel
            v: $.doc.by
          - k: t:rsi.trace.at
            v:
              of: $.doc.at
              fmt: stamp
          - k: t:rsi.library.for
            v:
              of: $.doc.objectiveNames
              sep: 、
            when: $.doc.objectiveNames
          - k: t:rsi.library.for
            v: t:rsi.library.whole
            when: "!$.doc.objectiveNames"
      - type: toolbar
        when:
          of: $.doc.state
          map:
            _: false
            pending: true
        items:
          - type: button
            primary: true
            label: t:rsi.library.confirm
            act: plugin
            args:
              request: docConfirm
              id: $.doc.id
            disabled: $.pending
          - type: button
            label: t:rsi.common.delete
            act: plugin
            args:
              request: docRemove
              id: $.doc.id
            disabled: $.pending
      - type: list
        id: rsi-doc-used
        label: t:rsi.library.usedLabel
        optional: true
        from: $.doc.usedBy
        row:
          layout: line
          key: "@e"
          title: "@name"
          cols:
            - v:
                text: "@e"
                mono: true
              w: id
      - type: list
        id: rsi-doc-sources
        label: t:rsi.library.sources
        optional: true
        from: $.doc.sources
        row:
          layout: line
          key: "@label"
          title: "@label"
          acts:
            - label: t:rsi.trace.thread
              icon: hook
              act: thread
              args:
                id: "@thread"
              when: "@thread"
      - type: markdown
        text: $.doc.body
    sources:
      doc: doc
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.objectiveTraces:
    bare: true
    blocks:
      - type: list
        id: rsi-traces
        when: $.objective.traces
        label:
          t: rsi.trace.label
          args:
            - $.objective.traces.total
            - $.objective.traces.items.length
        from: $.objective.traces.items
        empty: t:rsi.trace.none
        row:
          layout: two
          key: "@id"
          title: "@source"
          sub:
            sep: " · "
            parts:
              - text: "@cat"
              - text:
                  t: rsi.trace.whereOf
                  args:
                    - "@version"
                    - "@cycle"
          cols:
            - v:
                status:
                  tone: warn
                  text: t:rsi.trace.counter
              w: state
              when: "@counter"
            - v:
                text:
                  of: "@at"
                  fmt: ago
              w: time
          act: dialog
          args:
            kind: rsiRecord
            type: trace
            objective: $.objective.id
            cycle: "@cycleId"
            id: "@id"
            title: "@source"
