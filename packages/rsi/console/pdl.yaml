                row:
                  layout: line
                  key: "@unit"
                  title:
                    text:
                      of: "@op"
                      map:
                        modify:
                          t: rsi.change.modify
                          args:
                            - "@unitName"
                            - "@from"
                            - "@to"
                        add:
                          t: rsi.change.add
                          args:
                            - "@unitName"
                        remove:
                          t: rsi.change.remove
                          args:
                            - "@unitName"
                        enable:
                          t: rsi.change.enable
                          args:
                            - "@unitName"
                        disable:
                          t: rsi.change.disable
                          args:
                            - "@unitName"
                        _: "@unitName"
                  cols:
                    - v:
                        text:
                          t: rsi.card.shared
                          args:
                            - of: "@sharedNames"
                              sep: 、
                        tone: warn
                      w: label
                      when: "@sharedNames"
                    - v:
                        text:
                          t: rsi.apply
                          args:
                            - "@apply"
                      w: state
              - type: label
                text: t:rsi.card.predictions
              - type: list
                from: "@predictions"
                row:
                  layout: line
                  key: "@metric"
                  title: "@metric"
                  inline:
                    - chip: t:rsi.metric.locked
