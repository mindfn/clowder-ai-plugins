                    args:
                      kind: rsiReeval
                      card: "@id"
                    disabled: $.pending
                  - type: button
                    label: t:rsi.card.skip
                    act: plugin
                    args:
                      request: decide
                      card: "@id"
                      decision: skip
                    disabled: $.pending
    sources:
      cards: cards
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.cards:
    blocks:
      - type: head
