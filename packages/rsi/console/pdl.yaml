              - type: label
                text: t:rsi.card.collab
                when: "@collab"
              - type: text
                variant: para
                text: "@collab.text"
                when: "@collab"
              - type: toolbar
                items:
                  - type: button
                    primary: true
                    label: t:rsi.card.apply
                    act: plugin
                    args:
                      request: decide
                      card: "@id"
                      decision: apply
                    disabled: $.pending
                  - type: button
                    label: t:rsi.card.reevaluate
