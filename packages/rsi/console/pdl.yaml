rows:
  rsi.direction:
    layout: two
    key: "@id"
    lead:
      who: "@by"
      form: avatar
    title:
      - text:
          t: rsi.exp.dirKind
          args:
            - "@kind"
        variant: badge
        when: "@kind"
      - text: "@title"
    titleWrap: open
    inline:
      - chip: t:rsi.exp.disc.first
        when: "@first"
      - chip: t:rsi.exp.picked
        when: "@picked"
    sub:
      sep: " · "
      parts:
        - text:
            t: rsi.exp.disc.target
            args:
              - "@target"
          when: "@target"
        - text:
            t: rsi.exp.expect
            args:
              - "@expect"
          when: "@expect"
    cols:
      - control:
          - type: button
            label: t:rsi.exp.adopt
            act: plugin
            args:
              request: expDecide
              n: $.exp.cycle.n
              pick: direction
              directionId: "@id"
              note: ""
            when:
              - $.exp.cycle.waiting
              - "!$.exp.candidate"
            disabled: $.pending
    expand:
      - type: markdown
        text: "@why"
      - type: text
        variant: meta
        parts:
          - text: t:rsi.exp.cites
          - text:
              of: "@cites"
              sep: 、
        when: "@cites"
  rsi.first:
    layout: two
    key: "@id"
    lead:
      who: "@by"
      form: avatar
    title:
      - text:
          t: rsi.exp.dirKind
          args:
            - "@kind"
        variant: badge
        when: "@kind"
      - text: "@title"
    titleWrap: open
    inline:
      - chip: t:rsi.exp.picked
        when: "@picked"
    sub:
      sep: " · "
      parts:
        - who: "@by"
          form: name
        - text:
            t: rsi.exp.disc.target
            args:
              - "@target"
          when: "@target"
        - text:
            t: rsi.exp.expect
            args:
              - "@expect"
          when: "@expect"
    cols:
      - control:
          - type: button
            label: t:rsi.exp.adopt
            act: plugin
            args:
              request: expDecide
              n: $.exp.cycle.n
              pick: direction
              directionId: "@id"
              note: ""
            when:
              - $.exp.cycle.waiting
              - "!$.exp.candidate"
              - of: $.exp.step
                map:
                  _: false
                  gov: true
            disabled: $.pending
    expand:
      - type: markdown
        text: "@why"
  rsi.prep:
    layout: item
    key: "@id"
    title: "@title"
    subLines: 2
    inline:
      - chip: t:rsi.exp.prep.default
        when: "@isDefault"
      - text:
          t: rsi.exp.prep.decide
          args:
            - "@decision"
        variant: badge
        when: "@decision"
    sub:
      sep: " · "
      parts:
        - text: "@value"
          when: "@value"
        - text:
            t: rsi.exp.prep.recOf
            args:
              - t: rsi.exp.prep.decide
                args:
                  - "@rec"
          when:
            - "@rec"
            - "!@decision"
        - text: "@note"
          when: "@note"
    cols:
      - v:
          status:
            of: "@state"
            map:
              uninvestigated:
                tone: ""
                text: t:rsi.exp.prep.state.uninvestigated
              preparing:
                tone: info
                text: t:rsi.exp.prep.state.preparing
              confirmed:
                tone: ok
                text: t:rsi.exp.prep.state.confirmed
              _: ""
        w: state
        when:
          of: "@state"
          map:
            submitted: false
            _: true
      - control:
          - type: button
            label: t:rsi.exp.prep.confirm
            act: plugin
            args:
              request: prep
              id: "@id"
              op: confirm
            when:
              - of: "@state"
                map:
                  _: false
                  submitted: true
              - "!@rec"
            disabled: $.pending
      - control:
          - type: button
            label: t:rsi.exp.prep.decide.explore
            act: plugin
            args:
              request: prep
              id: "@id"
              op: decide
              decision: explore
            disabled: $.pending
          - type: button
            label: t:rsi.exp.prep.decide.fixed
            act: plugin
            args:
              request: prep
              id: "@id"
              op: decide
              decision: fixed
            disabled: $.pending
          - type: button
            label: t:rsi.exp.prep.decide.excluded
            act: plugin
            args:
              request: prep
              id: "@id"
              op: decide
              decision: excluded
            disabled: $.pending
        when:
          - of: "@state"
            map:
              _: false
              submitted: true
          - "@rec"
    acts:
      - label: t:rsi.exp.prep.edit
        icon: edit
        act: dialog
        args:
          kind: rsiPrepEdit
          id: "@id"
          title: "@title"
          value: "@value"
      - label: t:rsi.exp.prep.agent
        icon: bolt
        act: plugin
        args:
          request: prep
          id: "@id"
          op: agent
    expand:
      - type: text
        text: "@value"
        when: "@value"
      - type: kv
        from: "@facts"
        when: "@facts"
  rsi.doc:
    layout: two
    key: "@id"
    title: "@title"
    inline:
      - status:
          tone: warn
          text: t:rsi.library.pending
        when:
          of: "@state"
          map:
            _: false
            pending: true
    sub:
      sep: " · "
      parts:
        - text: "@path"
          mono: true
          when: "@path"
        - text: "@by"
        - text:
            of: "@objectiveNames"
            sep: 、
          when: "@objectiveNames"
        - text: t:rsi.library.whole
          when: "!@objectiveNames"
    cols:
      - v:
          text:
            t: rsi.library.usedBy
            args:
              - of: "@usedByEs"
                sep: " "
        w: label
        when: "@usedByEs"
      - v:
          text:
            of: "@at"
            fmt: ago
        w: time
    act: dialog
    args:
      kind: rsiDoc
      id: "@id"
      title: "@title"
  rsi.group:
    layout: two
    key: "@id"
    title: "@name"
    acts:
      - label: t:rsi.common.rename
        icon: edit
        act: dialog
        args:
          kind: rsiGroupRename
          id: "@id"
          name: "@name"
    sub:
      sep: " · "
      parts:
        - text: "@where"
        - text:
            t: rsi.caps.usedBy
            args:
              - "@users"
          when: "@users"
