                    row: rsi.direction
              - type: each
                from:
                  - {}
                when:
                  - of: $.exp.step
                    map:
                      _: false
                      gov: true
                  - "!$.exp.cycle.gov"
                blocks:
                  - type: notice
                    tone: info
                    text: t:rsi.exp.govPending
              - type: each
                from:
                  - {}
                when:
                  - of: $.exp.step
                    map:
                      _: false
                      gov: true
                  - $.exp.cycle.gov
                blocks:
                  - type: notice
                    tone: info
                    when:
                      of: $.exp.cycle.gov.led.k
                      map:
                        version: true
                        _: false
                    text:
                      t: rsi.exp.gov.ledVersion
                      args:
                        - $.exp.cycle.gov.iterate
                        - $.exp.cycle.gov.led.title
                    action:
                      type: button
                      label: t:rsi.exp.retryStage
                      act: plugin
                      args:
                        request: versionAgain
                      disabled: $.pending
                  - type: notice
                    tone: warn
                    when: $.exp.cycle.gov.ask
                    text:
                      of: $.exp.cycle.gov.ask
                      map:
                        confirm:
                          t: rsi.exp.gov.ask.confirm
                          args:
                            - $.exp.cycle.gov.candidate.group
                            - $.exp.cycle.gov.candidate.version
                        empty:
                          t: rsi.exp.gov.ask.empty
                          args:
                            - $.exp.cycle.gov.iterate
                        split: t:rsi.exp.gov.ask.split
                        agree: t:rsi.exp.gov.ask.agree
                        _: t:rsi.exp.gov.ask.choose
                  - type: list
                    id: rsi-exp-gov-firsts
                    label: t:rsi.exp.disc.firsts
                    when:
                      - $.exp.cycle.waiting
                      - "!$.exp.candidate"
                    from: $.exp.cycle.discussion.firsts
                    optional: true
                    actions:
                      - type: button
                        link: true
                        label: t:rsi.exp.gov.others
                        act: plugSet
                        args:
                          k: selO
                          v: $.exp.cycle.gov.discuss
                    row: rsi.first
                  - type: text
                    variant: meta
                    when:
                      - $.exp.cycle.waiting
                      - "!$.exp.candidate"
                      - $.exp.cycle.discussion.firsts
                    text:
                      t: rsi.exp.gov.adopt
                      args:
                        - $.exp.cycle.gov.iterate
                        - $.exp.cycle.gov.current
                  - type: list
                    id: rsi-exp-gov-choices
                    from: $.exp.cycle.gov.choices
                    optional: true
                    row:
                      layout: item
                      key: "@k"
                      title:
                        text:
                          of: "@k"
                          map:
                            same: t:rsi.exp.pick.same
                            promote: t:rsi.exp.pick.promote
                            _: t:rsi.exp.gov.noteTitle
                      sub:
                        text:
                          of: "@k"
                          map:
                            same:
                              of: $.exp.cycle.gov.ask
                              map:
                                confirm:
                                  t: rsi.exp.gov.sameConfirm
                                  args:
                                    - $.exp.cycle.gov.candidate.group
                                    - $.exp.cycle.gov.candidate.version
                                    - $.exp.cycle.gov.current
                                _:
                                  t: rsi.exp.gov.same
                                  args:
                                    - $.exp.cycle.gov.current
                            promote:
                              t: rsi.exp.gov.promote
                              args:
                                - $.exp.cycle.gov.candidate.version
                                - $.exp.cycle.gov.current
                            _:
                              t: rsi.exp.gov.note
                              args:
                                - $.exp.cycle.gov.iterate
                                - $.exp.cycle.gov.current
                      subLines: 2
                      cols:
                        - control:
                            - type: button
                              label: t:rsi.exp.pick.same
                              act: plugin
                              args:
                                request: expDecide
                                n: $.exp.cycle.n
                                pick: same
                                note: ""
                              when:
                                of: "@k"
                                map:
                                  same: true
                                  _: false
                              disabled: $.pending
                            - type: button
                              label: t:rsi.exp.pick.promote
                              act: plugin
                              args:
                                request: promoteVersion
                                objective: $.exp.id
                                version: $.exp.cycle.gov.candidate.version
                              when:
                                of: "@k"
                                map:
                                  promote: true
                                  _: false
                              disabled: $.pending
                            - type: button
                              label: t:rsi.exp.pick.info
                              act: dialog
                              args:
                                kind: rsiExpNote
                                n: $.exp.cycle.n
                                pick: info
                              when:
                                of: "@k"
                                map:
                                  note: true
                                  _: false
                              disabled: $.pending
                            - type: button
                              label: t:rsi.exp.pick.addVar
                              act: dialog
                              args:
                                kind: rsiExpNote
                                n: $.exp.cycle.n
                                pick: addVar
                              when:
                                of: "@k"
                                map:
                                  note: true
                                  _: false
                              disabled: $.pending
                            - type: button
                              label: t:rsi.exp.pick.metric
                              act: dialog
                              args:
                                kind: rsiExpNote
                                n: $.exp.cycle.n
                                pick: metric
                              when:
                                of: "@k"
                                map:
                                  note: true
                                  _: false
                              disabled: $.pending
                            - type: button
                              label: t:rsi.exp.pick.goal
                              act: dialog
                              args:
                                kind: rsiExpNote
                                n: $.exp.cycle.n
                                pick: goal
                              when:
                                of: "@k"
                                map:
                                  note: true
                                  _: false
                              disabled: $.pending
                  - type: list
                    label: t:rsi.exp.asks
                    optional: true
                    from: $.exp.cycle.report.asks
                    row:
                      layout: line
                      title: "@text"
                  - type: kv
                    when: $.exp.cycle.decision
                    from:
                      - k: t:rsi.exp.gov.chosen
                        v:
                          sep: " "
                          parts:
                            - text:
                                t: rsi.exp.pickName
                                args:
                                  - $.exp.cycle.decision.pick
                            - text:
                                t: rsi.exp.gov.adopted
                                args:
                                  - $.exp.cycle.gov.adopted.title
                              when: $.exp.cycle.gov.adopted
                      - k: t:rsi.exp.gov.from
                        who: $.exp.cycle.gov.adopted.by
                        when: $.exp.cycle.gov.adopted
                      - k: t:rsi.exp.gov.by
                        v:
                          sep: " · "
                          parts:
                            - text:
                                of: $.exp.cycle.decision.by
                                map:
                                  RSI: t:rsi.exp.gov.byRule
                                  _: $.exp.cycle.decision.by
                            - text:
                                of: $.exp.cycle.decision.at
                                fmt: stamp
                      - k: t:rsi.exp.note
                        v: $.exp.cycle.decision.note
                      - k: t:rsi.exp.gov.led
                        v:
                          t: rsi.exp.gov.ledCycle
                          args:
                            - $.exp.cycle.gov.led.n
                            - $.exp.cycle.gov.led.version
                        act: plugSet
                        args:
                          k: selO
                          v: $.exp.cycle.gov.led.go
                        when: $.exp.cycle.gov.led.go
                      - k: t:rsi.exp.gov.led
                        v:
                          of: $.exp.cycle.gov.led.k
                          map:
                            version:
                              t: rsi.exp.gov.ledVersion
                              args:
                                - $.exp.cycle.gov.iterate
                                - $.exp.cycle.gov.led.title
                            stop:
                              t: rsi.exp.gov.ledStop
                              args:
                                - $.exp.cycle.gov.led.text
                            _: t:rsi.exp.gov.ledLater
                        when: "!$.exp.cycle.gov.led.go"
                  - type: each
                    from:
                      - {}
                    when: $.exp.cycle.gov.hasDetails
                    blocks:
                      - type: label
                        text: t:rsi.exp.gov.changesTitle
                      - type: kv
                        when: $.exp.cycle.gov.pr
                        from:
                          - k: t:rsi.exp.pr
                            v: $.exp.cycle.gov.pr.id
                          - k: t:rsi.exp.gov.prTitle
                            v: $.exp.cycle.gov.pr.title
                            when: $.exp.cycle.gov.pr.title
                          - k: t:rsi.exp.gov.prUrl
                            v: $.exp.cycle.gov.pr.url
                            when: $.exp.cycle.gov.pr.url
                      - type: list
                        id: rsi-exp-gov-items
                        label: t:rsi.exp.gov.changeItems
                        optional: true
                        from: $.exp.cycle.gov.changeItems
                        row:
                          layout: line
                          key: "@key"
                          title: "@name"
                          inline:
                            - status:
                                of: "@op"
                                map:
                                  add:
                                    tone: ok
                                    text: t:rsi.exp.gov.op.add
                                  del:
                                    tone: danger
                                    text: t:rsi.exp.gov.op.del
                                  _:
                                    tone: info
                                    text: t:rsi.exp.gov.op.set
                          cols:
                            - v:
                                text: "@detail"
                                mono: true
                              w: auto
                      - type: list
                        id: rsi-exp-gov-files
                        label: t:rsi.exp.gov.diffFiles
                        optional: true
                        from: $.exp.cycle.gov.diffFiles
                        row:
                          layout: line
                          key: "@path"
                          title:
                            text: "@path"
                            mono: true
                          inline:
                            - status:
                                of: "@op"
                                map:
                                  add:
                                    tone: ok
                                    text: t:rsi.exp.gov.op.add
                                  delete:
                                    tone: danger
                                    text: t:rsi.exp.gov.op.del
                                  rename:
                                    tone: info
                                    text: t:rsi.exp.gov.op.rename
                                  _:
                                    tone: info
                                    text: t:rsi.exp.gov.op.modify
                          cols:
                            - v:
                                text: "@stats"
                                mono: true
                              w: auto
                              when: "@stats"
                          cur: "@selected"
                          act: plugSet
                          args:
                            k: govFile
                            v: "@path"
                      - type: each
                        from:
                          - {}
                        when: $.exp.cycle.gov.selectedFile
                        blocks:
                          - type: toolbar
                            left:
                              - type: text
                                text: $.exp.cycle.gov.selectedFile.path
                                mono: true
                                strong: true
                            right:
                              - type: seg
                                value: $.exp.cycle.gov.diffMode
                                options:
                                  - v: unified
                                    label: t:rsi.exp.gov.diffUnified
                                  - v: split
                                    label: t:rsi.exp.gov.diffSplit
                                act: plugSet
                                args:
                                  k: govDiffMode
                              - type: button
                                icon: close
                                iconOnly: true
                                label: t:rsi.exp.gov.diffClose
                                act: plugSet
                                args:
                                  k: govFile
                                  v: ""
                          - type: component
                            use: diff
                            props:
                              hunks: $.exp.cycle.gov.selectedFile.hunks
                              mode: $.exp.cycle.gov.diffMode
                              empty: t:rsi.exp.gov.diffEmpty
      - type: each
        from:
          - {}
        when:
          - of: $.exp.section
            map:
              execute: true
              _: false
          - $.exp.hasRounds
          - of: $.exp.tab
            map:
              _: false
              metrics: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.exp.eTree
              key: "@key"
              parent: "@parentKey"
              node:
                label:
                  - text: "@id"
                state: "@nodeState"
                pressed: "@nodeSelected"
                act: plugSet
                args:
                  k: selE
                  v: "@pick"
              cells:
                - type: select
                  when: "@cyclePick"
                  id: "@cyclePick.id"
                  label: t:rsi.cycle.pick
                  change: plugSet
                  args:
                    k: selE
                  value: "@cyclePick.value"
                  options:
                    - from: "@cyclePick.options"
                      item:
                        v: "@v"
                        label:
                          t: rsi.cycle.nOf
                          args:
                            - "@n"
                            - "@total"
                - type: each
                  from: "@steps"
                  control:
                    type: chip
                    label:
                      of: "@k"
                      map:
                        collect:
                          of: "@live"
                          map:
                            "true":
                              t: rsi.step.collectLive
                              args:
                                - "@n"
                            _:
                              t: rsi.step.collect
                              args:
                                - "@n"
                        eval:
                          t: rsi.step.eval
                          args:
                            - "@n"
                            - t: rsi.exp.verdict
                              args:
                                - "@result"
                        gov:
                          t: rsi.step.gov
                          args:
                            - t: rsi.govResult
                              args:
                                - "@result"
                    pressed: "@selected"
                    tone:
                      of: "@result"
                      map:
                        rollback: warn
                        insufficient: warn
                        waiting: warn
                        _: ""
                    act: plugSet
                    args:
                      k: selE
                      v: "@pick"
              tail:
                sep: " · "
                parts:
                  - text:
                      t: rsi.exp.eCount
                      args:
                        - "@count"
                  - text:
                      t: rsi.metricVersion.used
                      args:
                        - of: "@versionsUsed"
                          sep: " "
                    when: "@hasFewVersionsUsed"
                  - text:
                      t: rsi.exp.eUsedSummary
                      args:
                        - "@versionCount"
                        - "@roundCount"
                    when: "@manyVersionsUsed"
                  - text: "@by"
                    when: "@by"
          - type: section
            when: $.exp.eSel.hasDiff
            title:
              t: rsi.exp.eDiffTitle
              args:
                - $.exp.eSel.diff.parent
                - $.exp.eSel.diff.add
                - $.exp.eSel.diff.del
                - $.exp.eSel.diff.mod
            blocks:
              - type: text
                variant: meta
                text: $.exp.eSel.note
                when: $.exp.eSel.note
              - type: list
                from: $.exp.eSel.diffChanges
                row:
                  layout: two
                  key: "@key"
                  title: "@title"
                  inline:
                    - chip:
                        t: rsi.exp.eDiffKind
                        args:
                          - "@kind"
                  sub: "@detail"
          - type: text
            variant: meta
            text: $.exp.eSel.note
            when:
              - "!$.exp.eSel.hasDiff"
              - $.exp.eSel.note
          - type: section
            when: $.exp.eSel.hasCycles
            title:
              t: rsi.exp.eCyclesTitle
              args:
                - $.exp.eSel.id
            blocks:
              - type: list
                from: $.exp.eSel.cycleSummaries
                row:
                  layout: two
                  key: "@n"
                  title:
                    sep: " · "
                    parts:
                      - text:
                          t: rsi.exp.cycleNo
                          args:
                            - "@n"
                      - text: "@version"
                        mono: true
                        when: "@version"
                      - text: "@tag"
                        when: "@tag"
                  inline:
                    - chip:
                        t: rsi.exp.verdict
                        args:
                          - "@verdict"
                  sub: "@headline"
                  cols:
                    - v:
                        text: "@decisionText"
                      w: label
                      when: "@decisionText"
          - type: section
            title:
              t: rsi.exp.eMetricsTitle
              args:
                - $.exp.eSel.id
            blocks:
              - type: list
                from: $.exp.eSel.items
                row:
                  layout: two
                  key: "@id"
                  title: "@name"
                  inline:
                    - chip: t:rsi.metric.locked
                      when: "@locked"
                    - chip: t:rsi.metric.guard
                      when: "@guard"
                  sub: "@how"
                  cols:
                    - v:
                        text:
                          t: rsi.exp.dir
                          args:
                            - "@dir"
                      w: label
                    - v:
                        text: "@line"
                      w: label
                      when: "@line"
      - type: each
        from:
          - {}
        when:
          - of: $.exp.section
            map:
              execute: true
              _: false
          - $.exp.hasRounds
          - of: $.exp.tab
            map:
              _: false
              collect: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.exp.cTree
              key: "@key"
              parent: "@parentKey"
              node:
                label:
                  - text: "@id"
                state: "@nodeState"
                pressed: "@nodeSelected"
                act: plugSet
                args:
                  k: selC
                  v: "@pick"
              tail:
                sep: " · "
                parts:
                  - text:
                      t: rsi.exp.cRevTail
                      args:
                        - "@rev"
                  - text: "@by"
                    when: "@by"
                  - text: "@mcp"
                    mono: true
                    when: "@mcp"
                  - text:
                      t: rsi.exp.exState
                      args:
                        - "@state"
                    when: "@state"
          - type: text
            variant: meta
            text: $.exp.cSel.note
            when: $.exp.cSel.note
          - type: list
            label: t:rsi.exp.executor
            from: $.exp.cSel.ops
            when: $.exp.cSel.hasOps
            row:
              layout: two
              title: "@op"
              sub:
                text: "@params"
                mono: true
                when: "@params"
          - type: list
            label: t:rsi.exp.resultMap
            from: $.exp.executor.resultMap
            row:
              layout: line
              title: "@metric"
              cols:
                - v:
                    text: "@field"
                    mono: true
                  w: id
    sources:
      exp: exp
      members: host:members
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.objective:
    blocks:
      - type: head
        variant: detail
        title: $.objective.name
        sub: $.objective.statement
        actions:
          - type: status
            text:
              t: rsi.state
              args:
                - $.objective.state
            tone:
              of: $.objective.state
              map:
                pending: warn
                exhausted: warn
                baseline: info
                analyzing: info
                preparing: info
                ready: warn
                stalled: danger
                _: ""
          - type: button
            when:
              of: $.objective.state
              map:
                _: false
                ready: true
            primary: true
            label: t:rsi.life.start
            act: plugin
            args:
              request: life
              op: start
            disabled: $.pending
          - type: button
            when:
              of: $.objective.state
              map:
                _: false
                exhausted: true
            label: t:rsi.life.more
            act: plugin
            args:
              request: life
              op: more
            disabled: $.pending
          - type: button
            when:
              of: $.objective.state
              map:
                _: false
                paused: true
            label: t:rsi.life.resume
            act: plugin
            args:
              request: life
              op: resume
            disabled: $.pending
          - type: button
            when:
              of: $.objective.state
              map:
                collecting: true
                baseline: true
                pending: true
                _: false
            label: t:rsi.life.pause
            act: plugin
            args:
              request: life
              op: pause
            disabled: $.pending
          - type: button
            when: "!$.objective.setup"
            label: t:rsi.refresh
            act: plugSet
            args:
              k: _r
              v: ""
          - type: button
            when: "!$.objective.setup"
            iconOnly: true
            icon: gear
            label: t:rsi.policy.title
            act: dialog
            args:
              kind: rsiPolicy
          - type: button
            iconOnly: true
            icon: delete
            label: t:rsi.delete.action
            act: dialog
            args:
              kind: rsiDelete
              objective: $.objective.id
              name: $.objective.name
      - type: text
        when: "!$.objective.setup"
        parts:
          sep: " · "
          parts:
            - text:
                t: rsi.now.line
                args:
                  - $.objective.nowLine.o
                  - $.objective.nowLine.e
                  - $.objective.nowLine.c
            - text:
                t: rsi.now.collecting
                args:
                  - $.objective.nowLine.got
                  - $.objective.nowLine.need
              when: $.objective.nowLine.collecting
        actions:
          - type: button
            when: $.objective.nowLine.pick
            label: t:rsi.now.locate
            act: plugSet
            args:
              k: selO
              also:
                tab: version
              v:
                of: $.objective.nowLine.pick
                slice:
                  - 8
      - type: text
        variant: meta
        when:
          - "!$.objective.setup"
          - $.objective.overrides
        parts:
          - text: t:rsi.policy.overridden
          - parts: $.objective.overrides
            sep: 、
            each:
              text:
                t: rsi.policy.overrideOf
                args:
                  - t: rsi.policy
                    args:
                      - "@k"
                  - of: "@k"
                    map:
                      approval:
                        t: rsi.approval
                        args:
                          - "@v"
                      eval: "@name"
                      iterate: "@name"
                      metrics: "@name"
                      _: "@v"
      - type: list
        id: rsi-setup
        when: $.objective.setup
        from: $.objective.setup
        row:
          layout: line
          key: "@k"
          title:
            text:
              t: rsi.setup
              args:
                - "@k"
          cols:
            - v:
                status:
                  of: "@on"
                  map:
                    "true":
                      tone: info
                      text: t:rsi.setupState.on
                    _:
                      of: "@done"
                      map:
                        "true":
                          tone: ok
                          text: t:rsi.setupState.done
                        _: ""
              w: state
      - type: toolbar
        when: $.objective.setup
        items:
          - type: button
            label: t:rsi.caps.open
            act: plugSet
            args:
              k: pick
              v: caps
      - type: notice
        tone: warn
        when: $.objective.card
        text:
          t: rsi.card.waiting
          args:
            - $.objective.card.from
            - $.objective.card.to
        action:
          type: button
          label: t:rsi.card.open
          act: dialog
          args:
            kind: rsiCards
            objective: $.objective.id
      - type: toolbar
        when: "!$.objective.setup"
        items:
          - type: seg
            value: $.objective.tab
            options:
              - v: version
                label: t:rsi.tab.version
              - v: metrics
                label: t:rsi.tab.metrics
              - v: collect
                label: t:rsi.tab.collect
            act: plugSet
            args:
              k: tab
      - type: each
        from:
          - {}
        when:
          - "!$.objective.setup"
          - of: $.objective.tab
            map:
              _: false
              version: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.objective.versions
              key: "@key"
              parent: "@parentKey"
              node:
                label:
                  - text:
                      of: "@kind"
                      map:
                        candidate: t:rsi.version.candidate
                        _: "@id"
                state: "@nodeState"
                pressed: "@nodeSelected"
                act: plugSet
                args:
                  k: selO
                  v: "@pick"
              cells:
                - type: select
                  when: "@cyclePick"
                  id: "@cyclePick.id"
                  label: t:rsi.cycle.pick
                  change: plugSet
                  args:
                    k:
                      of: "@cyclePick.tree"
                      map:
                        rsiSelO: selO
                        rsiSelE: selE
                        rsiSelC: selC
                  value: "@cyclePick.value"
                  options:
                    - from: "@cyclePick.options"
                      item:
                        v: "@v"
                        label:
                          t: rsi.cycle.nOf
                          args:
                            - "@n"
                            - "@total"
                - type: each
                  from: "@steps"
                  control:
                    type: chip
                    label:
                      of: "@k"
                      map:
                        prep:
                          t: rsi.step.prep
                          args:
                            - t: rsi.prepResult
                              args:
                                - "@result"
                        apply:
                          t: rsi.step.apply
                          args:
                            - t: rsi.applyResult
                              args:
                                - "@result"
                        collect:
