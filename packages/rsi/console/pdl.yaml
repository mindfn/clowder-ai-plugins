              - type: button
                label: t:rsi.exp.retry
                act: plugin
                args:
                  request: initRetry
                  k: "@k"
                when:
                  of: "@state"
                  map:
                    _: false
                    cancelled: true
                disabled: $.pending
          - type: list
            from: "@items"
            row: rsi.prep
          - type: text
            variant: meta
            text:
              t: rsi.exp.unknownsOf
              args:
                - "@unknowns"
            when: "@unknowns"
          - type: text
            variant: meta
            text:
              t: rsi.exp.nextOf
              args:
                - "@next"
            when: "@next"
      - type: label
        text: t:rsi.exp.members
      - type: list
