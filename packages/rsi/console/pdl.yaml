                  card: bolt
                  stalled: alert
                  exhausted: clock
                  ready: play
                  _: bolt
          title: "@objectiveName"
          sub:
            sep: " · "
            parts:
              - text:
                  of: "@kind"
                  map:
                    card:
                      t: rsi.card.title
                      args:
                        - "@from"
                        - "@to"
                    stalled: t:rsi.todo.stalled
                    exhausted: t:rsi.todo.exhausted
                    ready: t:rsi.todo.ready
                    _: "@kind"
              - text:
                  t: rsi.card.round
                  args:
                    - "@round"
                when:
                  of: "@round"
                  gte: 2
          cols:
            - v:
                text:
                  of: "@at"
                  fmt: ago
              w: time
          acts:
            - label: t:rsi.todo.jump
              icon: hook
              act: plugin
              args:
                request: go
                objective: "@objective"
          expand:
            - type: box
              variant: card
              blocks:
                - type: text
                  variant: title
                  text:
                    t: rsi.card.titleOf
                    args:
                      - "@objectiveName"
                      - "@from"
                      - "@to"
                - type: text
                  variant: meta
                  when:
                    of: "@round"
                    gte: 2
                  text:
                    t: rsi.card.round
                    args:
                      - "@round"
                - type: label
                  text: t:rsi.card.basis
                - type: text
                  variant: para
                  text: "@basis"
                - type: text
                  variant: list
                  from: "@reasons"
                - type: label
                  text: t:rsi.card.proposal
                - type: list
                  from: "@actions"
                  row:
                    layout: line
                    key: "@unit"
                    title:
                      text:
                        of: "@op"
                        map:
                          modify:
                            t: rsi.change.modify
                            args:
                              - "@unitName"
                              - "@from"
                              - "@to"
                          add:
                            t: rsi.change.add
                            args:
                              - "@unitName"
                          remove:
                            t: rsi.change.remove
                            args:
                              - "@unitName"
                          enable:
                            t: rsi.change.enable
                            args:
                              - "@unitName"
                          disable:
                            t: rsi.change.disable
                            args:
                              - "@unitName"
                          _: "@unitName"
                    cols:
                      - v:
                          text:
                            t: rsi.card.shared
                            args:
                              - of: "@sharedNames"
                                sep: 、
                          tone: warn
                        w: label
                        when: "@sharedNames"
                      - v:
                          text:
                            t: rsi.apply
                            args:
                              - "@apply"
                        w: state
                - type: label
                  text: t:rsi.card.predictions
                - type: list
                  from: "@predictions"
                  row:
                    layout: line
                    key: "@metric"
                    title: "@metric"
                    inline:
                      - chip: t:rsi.metric.locked
                        when: "@locked"
                      - chip: t:rsi.metric.guard
                        when: "@guard"
                    cols:
                      - v:
                          text: "@expect"
                        w: label
                - type: label
                  text: t:rsi.card.collab
                  when: "@collab"
                - type: text
                  variant: para
                  text: "@collab.text"
                  when: "@collab"
                - type: toolbar
                  items:
                    - type: button
                      primary: true
                      label: t:rsi.card.apply
                      act: plugin
                      args:
                        request: decide
                        card: "@id"
                        decision: apply
                      disabled: $.pending
                    - type: button
                      label: t:rsi.card.reevaluate
                      act: dialog
                      args:
                        kind: rsiReeval
                        card: "@id"
                      disabled: $.pending
                    - type: button
                      label: t:rsi.card.skip
                      act: plugin
                      args:
                        request: decide
                        card: "@id"
                        decision: skip
                      disabled: $.pending
              when:
                of: "@kind"
                map:
                  _: false
                  card: true
            - type: notice
              tone: danger
              when:
                of: "@kind"
                map:
                  _: false
                  stalled: true
              text:
                of: "@stalledAt"
                map:
                  gov: t:rsi.stall.gov
                  _: t:rsi.stall.eval
            - type: toolbar
              when:
                of: "@kind"
                map:
                  _: false
                  stalled: true
              items:
                - type: button
                  primary: true
                  label: t:rsi.life.retry
                  act: plugin
                  args:
                    request: life
                    op: retry
                    objective: "@objective"
                  disabled: $.pending
                - type: button
                  label:
                    of: "@stalledAt"
                    map:
                      gov: t:rsi.thread.iterate
                      _: t:rsi.thread.eval
                  act: open
                  args:
                    kind: msg
                    t: "@thread"
            - type: toolbar
              when:
                of: "@kind"
                map:
                  _: false
                  exhausted: true
              items:
                - type: button
                  label: t:rsi.life.more
                  act: plugin
                  args:
                    request: life
                    op: more
                    objective: "@objective"
                  disabled: $.pending
            - type: toolbar
              when:
                of: "@kind"
                map:
                  _: false
                  ready: true
              items:
                - type: button
                  primary: true
                  label: t:rsi.life.start
                  act: plugin
                  args:
                    request: life
                    op: start
                    objective: "@objective"
                  disabled: $.pending
    sources:
      todo: todo
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  dlg.rsiRecord:
    title: $.title
    wide: true
    blocks:
      - type: kv
        when:
          of: $.record.type
          map:
            _: false
            trace: true
        from:
          - k: t:rsi.trace.at
            v:
              of: $.record.at
              fmt: stamp
          - k: t:rsi.trace.cat
            v: $.record.cat
          - k: t:rsi.trace.where
            v:
              t: rsi.trace.whereOf
              args:
                - $.record.version
                - $.record.cycle
          - k: t:rsi.trace.c
            v: $.record.c
      - type: kv
        when:
          of: $.record.type
          map:
            _: false
            run: true
        from:
          - k: t:rsi.trace.at
            v:
              of: $.record.at
              fmt: stamp
          - k: t:rsi.run.change
            v:
              of: "@op"
              map:
                modify:
                  t: rsi.change.modify
                  args:
                    - "@unitName"
                    - "@from"
                    - "@to"
                add:
                  t: rsi.change.add
                  args:
                    - "@unitName"
                remove:
                  t: rsi.change.remove
                  args:
                    - "@unitName"
                enable:
                  t: rsi.change.enable
                  args:
                    - "@unitName"
                disable:
                  t: rsi.change.disable
                  args:
                    - "@unitName"
                _: "@unitName"
          - k: t:rsi.run.apply
            v:
              t: rsi.apply
              args:
                - $.record.apply
          - k: t:rsi.run.pr
            v: $.record.pr
            when: $.record.pr
          - k: t:rsi.run.script
            v: $.record.run
            when: $.record.run
          - k: t:rsi.run.by
            v:
              t: rsi.by
              args:
                - $.record.by
      - type: toolbar
        when: $.record.thread
        items:
          - type: button
            label: t:rsi.trace.thread
            act: open
            args:
              kind: msg
              t: $.record.thread
      - type: list
        id: rsi-record-results
        label:
          of: $.record.type
          map:
            run: t:rsi.run.results
            _: t:rsi.trace.results
        from: $.record.results
        empty: t:rsi.trace.noResults
        row:
          layout: line
          key: "@name"
          title: "@name"
          cols:
            - v:
                status:
                  of: "@pass"
                  map:
                    "true":
                      tone: ok
                      text: t:rsi.trace.pass
                    _:
                      tone: warn
                      text:
                        of: $.record.type
                        map:
                          run: t:rsi.run.fail
                          _: t:rsi.trace.counter
              w: state
      - type: list
        id: rsi-record-events
        label:
          of: $.record.type
          map:
            run: t:rsi.run.events
            _: t:rsi.trace.events
        from: $.record.events
        row:
          layout: two
          key: "@source"
          title: "@text"
          sub: "@source"
          cols:
            - v:
                status:
                  of: "@state"
                  map:
                    hit:
                      tone: warn
                      text: t:rsi.trace.counter
                    failed:
                      tone: danger
                      text: t:rsi.run.state.failed
                    _: ""
              w: state
              when: "@state"
            - v:
                text:
                  of: "@at"
