              label:
                t: rsi.memberOption
                args:
                  - "@name"
                  - "@handle"
              when: "@on"
        arg: evaluate
      - id: dlg-iterate
        label: t:rsi.newExp.iterate
        help: t:rsi.newExp.iterateHelp
        value: codex
        options:
          - from: $.cats
            item:
              v: "@id"
              label:
                t: rsi.memberOption
                args:
                  - "@name"
                  - "@handle"
              when: "@on"
