rows:
  rsi.prep:
    layout: two
    key: "@id"
    title: "@title"
    inline:
      - chip: t:rsi.exp.prep.default
        when: "@isDefault"
      - status:
          tone: warn
          text: t:rsi.exp.prep.needYou
        when: "@needYou"
      - status:
          of: "@can"
          map:
            modifiable:
              tone: ok
              text: t:rsi.exp.prep.can.modifiable
            partial:
              tone: warn
              text: t:rsi.exp.prep.can.partial
            no:
              tone: ""
              text: t:rsi.exp.prep.can.no
            unknown:
              tone: warn
              text: t:rsi.exp.prep.can.unknown
            _: ""
        when: "@can"
      - text: "@tag"
        variant: badge
        when: "@tag"
      - text:
          t: rsi.exp.prep.decide
          args:
            - "@decision"
        variant: badge
        when: "@decision"
    sub:
      sep: " · "
      parts:
        - text: "@by"
          when: "@by"
        - text: "@value"
          when: "@value"
        - text:
            t: rsi.exp.prep.recOf
            args:
              - t: rsi.exp.prep.decide
                args:
                  - "@rec"
          when:
            - "@rec"
            - "!@decision"
        - text: "@note"
          when: "@note"
    cols:
      - v:
          status:
            of: "@state"
            map:
              uninvestigated:
                tone: ""
                text: t:rsi.exp.prep.state.uninvestigated
              preparing:
                tone: info
                text: t:rsi.exp.prep.state.preparing
              submitted:
                tone: ""
                text: t:rsi.exp.prep.state.submitted
              confirmed:
                tone: ok
                text: t:rsi.exp.prep.state.confirmed
              _: ""
        w: state
      - control:
          - type: button
            label: t:rsi.exp.prep.confirm
            act: plugin
            args:
              request: prep
              id: "@id"
              op: confirm
            when:
              - of: "@state"
                map:
                  _: false
                  submitted: true
              - "!@rec"
            disabled: $.pending
      - control:
          - type: button
            label: t:rsi.exp.prep.decide.explore
            act: plugin
            args:
              request: prep
              id: "@id"
              op: decide
              decision: explore
            disabled: $.pending
          - type: button
            label: t:rsi.exp.prep.decide.fixed
            act: plugin
            args:
              request: prep
              id: "@id"
              op: decide
              decision: fixed
            disabled: $.pending
          - type: button
            label: t:rsi.exp.prep.decide.excluded
            act: plugin
            args:
              request: prep
              id: "@id"
              op: decide
              decision: excluded
            disabled: $.pending
        when:
          - of: "@state"
            map:
              _: false
              submitted: true
          - "@rec"
    acts:
      - label: t:rsi.exp.prep.edit
        icon: edit
        act: dialog
        args:
          kind: rsiPrepEdit
          id: "@id"
          title: "@title"
          value: "@value"
      - label: t:rsi.exp.prep.agent
        icon: bolt
        act: plugin
        args:
          request: prep
          id: "@id"
          op: agent
    expand:
      - type: kv
        from: "@facts"
  rsi.doc:
    layout: two
    key: "@id"
    title: "@title"
    inline:
      - status:
          tone: warn
          text: t:rsi.library.pending
        when:
          of: "@state"
          map:
            _: false
            pending: true
    sub:
      sep: " · "
      parts:
        - text: "@path"
          mono: true
          when: "@path"
        - text: "@by"
        - text:
            of: "@objectiveNames"
            sep: 、
          when: "@objectiveNames"
        - text: t:rsi.library.whole
          when: "!@objectiveNames"
    cols:
      - v:
          text:
            t: rsi.library.usedBy
            args:
              - of: "@usedByEs"
                sep: " "
        w: label
        when: "@usedByEs"
      - v:
          text:
            of: "@at"
            fmt: ago
        w: time
    act: dialog
    args:
      kind: rsiDoc
      id: "@id"
      title: "@title"
  rsi.group:
    layout: two
    key: "@id"
    title: "@name"
    acts:
      - label: t:rsi.common.rename
        icon: edit
        act: dialog
        args:
          kind: rsiGroupRename
          id: "@id"
          name: "@name"
    sub:
      sep: " · "
      parts:
        - text: "@where"
        - text:
            t: rsi.caps.usedBy
            args:
              - "@users"
          when: "@users"
requests:
  home:
    path: rsi/view
    method: GET
    query:
      view: home
      project: state.project
      pick: state.pick
      tab: state.tab
      selO: state.selO
      selE: state.selE
      selC: state.selC
      thread: host:currentThread.id
  objective:
    path: rsi/view
    method: GET
    query:
      view: objective
      project: state.project
      pick: state.pick
      tab: state.tab
      selO: state.selO
      selE: state.selE
      selC: state.selC
      thread: host:currentThread.id
  exp:
    path: rsi/view
    method: GET
    query:
