              args:
                - "@role"
          sub:
            parts:
              - who: "@catId"
                form: title
                when: "@catId"
              - text: "@name"
                when: "!@catId"
          cols:
            - v:
                text: "@model"
                mono: true
              w: id
          acts:
            - label: t:rsi.exp.analystRemove
              icon: delete
              act: plugin
              args:
                request: analystRemove
                catId: "@catId"
              when:
                of: "@role"
                map:
                  analyze: true
                  _: false
      - type: button
        label: t:rsi.exp.analystAdd
        when: $.exp.projectPath
        act: dialog
        args:
          kind: rsiAnalystAdd
          cats: $.members.defaultCatOptions
      - type: label
        text: t:rsi.exp.policyTitle
      - type: kv
        from:
          - k: t:rsi.exp.pol.schedule
            v: $.exp.policy.schedule.window
          - k: t:rsi.exp.pol.seeds
            v:
              t: rsi.exp.seedsOf
              args:
                - $.exp.policy.seeds
          - k: t:rsi.exp.pol.vars
            v:
              of: $.exp.policy.vars
              sep: ；
              item:
                t: rsi.exp.varOf
                args:
                  - "@name"
                  - of: "@values"
                    sep: " / "
          - k: t:rsi.exp.pol.auto
            v: $.exp.policy.autoText
