                        label: t:rsi.thread.metrics
                        act: thread
                        args:
                          id: $.objective.threads.metrics
                  - type: text
                    parts:
                      - text:
                          t: rsi.evalResult
                          args:
                            - $.objective.eEval.kind
                        strong: true
                  - type: text
                    variant: para
                    text: $.objective.eEval.basis
                  - type: list
                    id: rsi-e-refs
                    label: t:rsi.library.refs
                    optional: true
                    from: $.objective.eRefs
                    row: rsi.doc
              - type: each
                from:
                  - {}
                when:
                  of: $.objective.eStep
                  map:
                    _: false
                    gov: true
                blocks:
                  - type: toolbar
                    items:
                      - type: button
                        label: t:rsi.thread.metrics
                        act: thread
                        args:
                          id: $.objective.threads.metrics
                  - type: text
                    parts:
                      - text:
                          t: rsi.gov.toOf
                          args:
                            - $.objective.eEval.to
                      - text:
                          t: rsi.gov.cardOf
                          args:
                            - t: rsi.cycle.card
                              args:
                                - $.objective.eEval.card.result
                            - t: rsi.by
                              args:
                                - $.objective.eEval.card.by
                        when: $.objective.eEval.card
                  - type: text
                    variant: meta
                    text: $.objective.eEval.basis
      - type: each
        from:
          - {}
        when:
          - "!$.objective.setup"
          - of: $.objective.tab
            map:
              _: false
              collect: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.objective.collectVersions
              key: "@key"
              parent: "@parentKey"
              node:
                label:
                  - text: "@id"
                state: "@nodeState"
                pressed: "@nodeSelected"
                act: plugSet
                args:
                  k: selC
                  v: "@pick"
              cells:
                - type: select
                  when: "@cyclePick"
                  id: "@cyclePick.id"
                  label: t:rsi.cycle.pick
                  change: plugSet
                  args:
                    k:
                      of: "@cyclePick.tree"
                      map:
                        rsiSelO: selO
                        rsiSelE: selE
                        rsiSelC: selC
                  value: "@cyclePick.value"
                  options:
                    - from: "@cyclePick.options"
                      item:
                        v: "@v"
                        label:
                          t: rsi.cycle.nOf
                          args:
                            - "@n"
                            - "@total"
                - type: each
                  from: "@steps"
                  control:
                    type: chip
                    label:
                      of: "@k"
                      map:
                        prep:
                          t: rsi.step.prep
                          args:
                            - t: rsi.prepResult
                              args:
                                - "@result"
                        apply:
                          t: rsi.step.apply
                          args:
                            - t: rsi.applyResult
                              args:
                                - "@result"
                        collect:
                          of: "@live"
                          map:
                            "true":
                              t: rsi.step.collectLive
                              args:
                                - "@n"
                            _:
                              t: rsi.step.collect
                              args:
                                - "@n"
                        eval:
                          t: rsi.step.eval
                          args:
                            - "@n"
                            - t: rsi.evalResult
                              args:
                                - "@result"
                        gov:
                          t: rsi.step.gov
                          args:
                            - t: rsi.govResult
                              args:
                                - "@result"
                        cycles:
                          t: rsi.step.cycles
                          args:
                            - "@count"
                    pressed: "@selected"
                    tone:
                      of: "@result"
                      map:
                        pending: warn
                        rollback: warn
                        failed: warn
                        _: ""
                    act: plugSet
                    args:
                      k: selC
                      v: "@pick"
              tail:
                sep: " · "
                parts:
                  - text:
                      t: rsi.collectVersion.for
                      args:
                        - "@for"
                  - text:
                      of: "@pointNames"
                      sep: 、
          - type: section
            title:
              of: $.objective.cStep
              map:
                node:
                  t: rsi.detail.node
                  args:
                    - $.objective.cSel.id
                gov:
                  t: rsi.detail.gov
                  args:
                    - $.objective.cSel.id
                _:
                  t: rsi.detail.mstep
                  args:
                    - $.objective.cSel.id
                    - t: rsi.stepName
                      args:
                        - $.objective.cStep
            blocks:
              - type: text
                variant: list
                when:
                  of: $.objective.cStep
                  map:
                    _: false
                    node: true
                from: $.objective.cSel.pointNames
              - type: view
                id: rsi.objectiveTraces
                when: $.objective.traces
              - type: text
                variant: para
                when:
                  of: $.objective.cStep
                  map:
                    _: false
                    eval: true
                text: $.objective.cEval.basis
              - type: text
                when:
                  of: $.objective.cStep
                  map:
                    _: false
                    gov: true
                parts:
                  - text:
                      t: rsi.gov.toOf
                      args:
                        - $.objective.cEval.to
                  - text:
                      t: rsi.gov.cardOf
                      args:
                        - t: rsi.cycle.card
                          args:
                            - $.objective.cEval.card.result
                        - t: rsi.by
                          args:
                            - $.objective.cEval.card.by
                    when: $.objective.cEval.card
    sources:
      objective: objective
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.caps:
    blocks:
      - type: head
        variant: detail
        title: t:rsi.nav.caps
        help: t:rsi.caps.help
      - type: empty
