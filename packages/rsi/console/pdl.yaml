ns: rsi
inserts:
  - id: rsi
    anchor: rail.top
    at: inside
    node:
      title: t:rsi.home.title
      icon: bolt
      open:
        node: rsi.home
  - id: rsi.panel
    anchor: panel.tools
    at: inside
    node:
      title: t:rsi.panel
      icon: bolt
      open:
        node: rsi.panel
      tool: true
views:
  rsi.home:
    page: true
    blocks:
      - type: split
        picked: $.home.picked
        back:
          act: plugSet
          args:
            plugin: official.rsi
            k: pick
            v: $.home.listKey
        left:
          - type: head
            title: t:rsi.home.title
            help: t:rsi.home.help
            actions:
              - type: button
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNewExp
                  thread: $.currentThread.id
                  projects: $.home.projects
                  cats: $.members.defaultCatOptions
                disabled: $.pending
                when: $.home.exp
              - type: button
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNew
                disabled: $.pending
                when: "!$.home.exp"
          - type: toolbar
            items:
              - type: select
                id: rsi-project
                options:
                  - from: $.home.projects
                    item:
                      v: "@choice"
                      label: "@name"
                value: $.home.projectChoice
                prefix: t:rsi.projectPrefix
                label: t:rsi.project
                change: plugSet
                args:
                  k: project
                  also:
                    pick: ""
          - type: list
            id: rsi-nav
            from: $.home.navs
            row:
              layout: line
              key: "@k"
              title:
                text:
                  t: rsi.nav
                  args:
                    - "@k"
              cols:
                - v:
                    text: "@count"
                    num: true
                  w: num
                  when: "@count"
              tone:
                - when: "@selected"
                  value: selected
                - value: ""
              act: plugSet
              args:
                k: pick
                v: "@pickKey"
          - type: box
            variant: scroll
            blocks:
              - type: label
                text: t:rsi.objectives
              - type: empty
                text: t:rsi.noObjectives
                when: "!$.home.hasObjectives"
                action:
                  type: each
                  from: $.home.projects
                  control:
                    type: stack
                    when:
                      - of: "@id"
                        gte: $.home.projectId
                      - of: $.home.projectId
                        gte: "@id"
                    items:
                      - type: button
                        label: t:rsi.new
                        act: dialog
                        args:
                          kind: rsiNewExp
                          thread: $.currentThread.id
                          projects: $.home.projects
                          cats: $.members.defaultCatOptions
                        disabled: $.pending
                        when: "@exp"
                      - type: button
                        label: t:rsi.new
                        act: dialog
                        args:
                          kind: rsiNew
                        disabled: $.pending
                        when: "!@exp"
              - type: tree
                id: rsi-objectives
                nodes: $.home.nodes
                ready: true
                when: $.home.hasObjectives
                row:
                  layout: two
                  title: "@name"
                  inline:
                    - status:
                        of: "@state"
                        map:
                          collecting:
                            tone: ""
                            text: t:rsi.state.collecting
                          pending:
                            tone: warn
                            text: t:rsi.state.pending
                          baseline:
                            tone: info
                            text: t:rsi.state.baseline
                          paused:
                            tone: ""
                            text: t:rsi.state.paused
                          exhausted:
                            tone: warn
                            text: t:rsi.state.exhausted
                          analyzing:
                            tone: info
                            text: t:rsi.state.analyzing
                          preparing:
                            tone: info
                            text: t:rsi.state.preparing
                          retired:
                            tone: ""
                            text: t:rsi.state.retired
                          ready:
                            tone: warn
                            text: t:rsi.state.ready
                          running:
                            tone: info
                            text: t:rsi.state.running
                          stalled:
                            tone: danger
                            text: t:rsi.state.stalled
                          _: ""
                      when: "@state"
                  sub:
                    parts:
                      - text:
                          t: rsi.exp.triggerOf
                          args:
                            - "@trigger"
                        when: "@trigger"
                      - text:
                          t: rsi.now.collecting
                          args:
                            - "@cycle.got"
                            - "@cycle.need"
                        when: "@cycle"
                  cols:
                    - v:
                        text: "@running.o"
                        mono: true
                      w: id
                      when: "@running"
                  cur: "@selected"
                  acts:
                    - label: t:rsi.delete.action
                      icon: delete
                      act: dialog
                      args:
                        kind: rsiDelete
                        objective: "@id"
                        name: "@name"
                select:
                  act: plugSet
                  args:
                    k: pick
                    v: "@pickKey"
        right:
          - type: empty
            icon: bolt
            text: t:rsi.noObjectivesHint
            when:
              of: $.home.pick.k
              map:
                none: true
                _: false
            action:
              type: each
              from: $.home.projects
              control:
                type: stack
                when:
                  - of: "@id"
                    gte: $.home.projectId
                  - of: $.home.projectId
                    gte: "@id"
                items:
                  - type: button
                    primary: true
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNewExp
                      thread: $.currentThread.id
                      projects: $.home.projects
                      cats: $.members.defaultCatOptions
                    disabled: $.pending
                    when: "@exp"
                  - type: button
                    primary: true
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNew
                    disabled: $.pending
                    when: "!@exp"
          - type: view
            id: rsi.objective
            when:
              - of: $.home.pick.k
                map:
                  obj: true
                  _: false
              - "!$.home.pick.exp"
          - type: view
            id: rsi.exp
            when:
              - of: $.home.pick.k
                map:
                  obj: true
                  _: false
              - $.home.pick.exp
          - type: view
            id: rsi.caps
            when:
              of: $.home.pick.k
              map:
                caps: true
                _: false
          - type: view
            id: rsi.library
            when:
              of: $.home.pick.k
              map:
                library: true
                _: false
          - type: view
            id: rsi.cards
            when:
              of: $.home.pick.k
              map:
                cards: true
                _: false
    route: rsi
    sources:
      home: home
      members: host:members
      currentThread: host:currentThread
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.panel:
    page: true
    blocks:
      - type: split
        picked: $.home.picked
        back:
          act: plugSet
          args:
            plugin: official.rsi
            k: pick
            v: $.home.listKey
        left:
          - type: head
            title: t:rsi.home.title
            help: t:rsi.home.help
            actions:
              - type: button
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNewExp
                  thread: $.currentThread.id
                  projects: $.home.projects
                  cats: $.members.defaultCatOptions
                disabled: $.pending
                when: $.home.exp
              - type: button
                label: t:rsi.new
                act: dialog
                args:
                  kind: rsiNew
                disabled: $.pending
                when: "!$.home.exp"
          - type: toolbar
            items:
              - type: select
                id: rsi-project
                options:
                  - from: $.home.projects
                    item:
                      v: "@choice"
                      label: "@name"
                value: $.home.projectChoice
                prefix: t:rsi.projectPrefix
                label: t:rsi.project
                change: plugSet
                args:
                  k: project
                  also:
                    pick: ""
          - type: list
            id: rsi-nav
            from: $.home.navs
            row:
              layout: line
              key: "@k"
              title:
                text:
                  t: rsi.nav
                  args:
                    - "@k"
              cols:
                - v:
                    text: "@count"
                    num: true
                  w: num
                  when: "@count"
              tone:
                - when: "@selected"
                  value: selected
                - value: ""
              act: plugSet
              args:
                k: pick
                v: "@pickKey"
          - type: box
            variant: scroll
            blocks:
              - type: label
                text: t:rsi.objectives
              - type: empty
                text: t:rsi.noObjectives
                when: "!$.home.hasObjectives"
                action:
                  type: each
                  from: $.home.projects
                  control:
                    type: stack
                    when:
                      - of: "@id"
                        gte: $.home.projectId
                      - of: $.home.projectId
                        gte: "@id"
                    items:
                      - type: button
                        label: t:rsi.new
                        act: dialog
                        args:
                          kind: rsiNewExp
                          thread: $.currentThread.id
                          projects: $.home.projects
                          cats: $.members.defaultCatOptions
                        disabled: $.pending
                        when: "@exp"
                      - type: button
                        label: t:rsi.new
                        act: dialog
                        args:
                          kind: rsiNew
                        disabled: $.pending
                        when: "!@exp"
              - type: tree
                id: rsi-objectives
                nodes: $.home.nodes
                ready: true
                when: $.home.hasObjectives
                row:
                  layout: two
                  title: "@name"
                  inline:
                    - status:
                        of: "@state"
                        map:
                          collecting:
                            tone: ""
                            text: t:rsi.state.collecting
                          pending:
                            tone: warn
                            text: t:rsi.state.pending
                          baseline:
                            tone: info
                            text: t:rsi.state.baseline
                          paused:
                            tone: ""
                            text: t:rsi.state.paused
                          exhausted:
                            tone: warn
                            text: t:rsi.state.exhausted
                          analyzing:
                            tone: info
                            text: t:rsi.state.analyzing
                          preparing:
                            tone: info
                            text: t:rsi.state.preparing
                          retired:
                            tone: ""
                            text: t:rsi.state.retired
                          ready:
                            tone: warn
                            text: t:rsi.state.ready
                          running:
                            tone: info
                            text: t:rsi.state.running
                          stalled:
                            tone: danger
                            text: t:rsi.state.stalled
                          _: ""
                      when: "@state"
                  sub:
                    parts:
                      - text:
                          t: rsi.exp.triggerOf
                          args:
                            - "@trigger"
                        when: "@trigger"
                      - text:
                          t: rsi.now.collecting
                          args:
                            - "@cycle.got"
                            - "@cycle.need"
                        when: "@cycle"
                  cols:
                    - v:
                        text: "@running.o"
                        mono: true
                      w: id
                      when: "@running"
                  cur: "@selected"
                  acts:
                    - label: t:rsi.delete.action
                      icon: delete
                      act: dialog
                      args:
                        kind: rsiDelete
                        objective: "@id"
                        name: "@name"
                select:
                  act: plugSet
                  args:
                    k: pick
                    v: "@pickKey"
        right:
          - type: empty
            icon: bolt
            text: t:rsi.noObjectivesHint
            when:
              of: $.home.pick.k
              map:
                none: true
                _: false
            action:
              type: each
              from: $.home.projects
              control:
                type: stack
                when:
                  - of: "@id"
                    gte: $.home.projectId
                  - of: $.home.projectId
                    gte: "@id"
                items:
                  - type: button
                    primary: true
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNewExp
                      thread: $.currentThread.id
                      projects: $.home.projects
                      cats: $.members.defaultCatOptions
                    disabled: $.pending
                    when: "@exp"
                  - type: button
                    primary: true
                    label: t:rsi.new
                    act: dialog
                    args:
                      kind: rsiNew
                    disabled: $.pending
                    when: "!@exp"
          - type: view
            id: rsi.objective
            when:
              - of: $.home.pick.k
                map:
                  obj: true
                  _: false
              - "!$.home.pick.exp"
          - type: view
            id: rsi.exp
            when:
              - of: $.home.pick.k
                map:
                  obj: true
                  _: false
              - $.home.pick.exp
          - type: view
            id: rsi.caps
            when:
              of: $.home.pick.k
              map:
                caps: true
                _: false
          - type: view
            id: rsi.library
            when:
              of: $.home.pick.k
              map:
                library: true
                _: false
          - type: view
            id: rsi.cards
            when:
              of: $.home.pick.k
              map:
                cards: true
                _: false
    panel:
      - t:rsi.panel
      - bolt
      - ""
      - other
      - t:rsi.home.help
    sources:
      home: home
      members: host:members
      currentThread: host:currentThread
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.exp:
    blocks:
      - type: head
        variant: detail
        title: $.exp.name
        actions:
          - type: status
            text:
              t: rsi.state
              args:
                - $.exp.state
            tone:
              of: $.exp.state
              map:
                pending: warn
                preparing: info
                ready: warn
                running: info
                paused: warn
                _: ""
          - type: button
            label: t:rsi.phase2.refresh
            when: $.exp.projectPath
            act: plugin
            args:
              request: refresh
            disabled: $.pending
          - type: button
            label: t:rsi.phase2.runCycle
            when: $.exp.projectPath
            act: plugin
            args:
              request: runCycle
              objective: $.exp.id
            disabled: $.pending
          - type: button
            when:
              of: $.exp.state
              map:
                _: false
                ready: true
            primary: true
            label: t:rsi.life.start
            act: plugin
            args:
              request: life
              op: start
            disabled: $.pending
          - type: button
            when:
              of: $.exp.state
              map:
                ready: true
                pending: true
                _: false
            label: t:rsi.life.pause
            act: plugin
            args:
              request: life
              op: pause
            disabled: $.pending
          - type: button
            when:
              of: $.exp.state
              map:
                _: false
                paused: true
            label: t:rsi.life.resume
            act: plugin
            args:
              request: life
              op: resume
            disabled: $.pending
          - type: button
            when:
              of: $.exp.next.k
              map:
                _: false
                stale: true
            primary: true
            label: t:rsi.exp.redo
            act: plugin
            args:
              request: initRedo
            disabled: $.pending
          - type: button
            when: "!$.exp.setup"
            label: t:rsi.exp.declare
            act: dialog
            args:
              kind: rsiExpPrep
          - type: button
            label: t:rsi.exp.thread
            act: open
            args:
              kind: msg
              t: $.exp.thread
          - type: button
            iconOnly: true
            icon: delete
            label: t:rsi.delete.action
            act: dialog
            args:
              kind: rsiDelete
              objective: $.exp.id
              name: $.exp.name
      - type: kv
        from:
          - k: t:rsi.exp.now.version
            v:
              t: rsi.exp.now.versionOf
              args:
                - $.exp.now.version
                - $.exp.now.change
          - k: t:rsi.exp.now.when
            v:
              t: rsi.exp.now.whenOf
              args:
                - $.exp.now.when
                - $.exp.now.window
                - $.exp.now.v
                - $.exp.now.n
          - k: t:rsi.exp.now.how
            v:
              t: rsi.exp.now.howOf
              args:
                - $.exp.now.plan.groups
                - $.exp.now.plan.seeds
                - $.exp.now.exec
            when: $.exp.now.plan
          - k: t:rsi.exp.now.how
            v:
              t: rsi.exp.now.howLater
              args:
                - $.exp.now.when
            when: "!$.exp.now.plan"
          - k: t:rsi.exp.now.metrics
            v:
              t: rsi.exp.now.metricsOf
              args:
                - $.exp.now.e
                - $.exp.now.metrics
            when: $.exp.now.metrics
          - k: t:rsi.exp.now.metrics
            v: t:rsi.exp.now.later
            when: "!$.exp.now.metrics"
      - type: notice
        tone:
          of: $.exp.next.k
          map:
            decide: warn
            prep: warn
            stale: warn
            ready: warn
            cancelled: warn
            interrupted: warn
            _: info
        text:
          t: rsi.exp.next
          args:
            - $.exp.next.k
            - $.exp.next.v
            - $.exp.next.n
            - $.exp.next.count
            - $.exp.next.window
            - of: $.exp.next.k
              map:
                init:
                  t: rsi.exp.doingOf
                  args:
                    - $.exp.next.by.0.who
                    - $.exp.next.by.0.i
                _: $.exp.next.by
            - $.exp.next.hint
            - of: $.exp.next.by.1.i
              gte: 1
              map:
                "true":
                  t: rsi.exp.doingAlso
                  args:
                    - $.exp.next.by.1.who
                    - $.exp.next.by.1.i
                _: ""
        action:
          type: stack
          items:
            - type: button
              label: t:rsi.now.locate
              act: plugSet
              args:
                k: selO
                also:
                  tab: version
                v:
                  of: $.exp.next.go
                  slice:
                    - 8
              when: $.exp.next.go
            - type: button
              label: t:rsi.exp.wakeAgain
              act: plugin
              args:
                request: initRetry
                k: $.exp.next.by.0.k
                force: "true"
              disabled: $.pending
              when:
                of: $.exp.next.k
                map:
                  init: true
                  _: false
            - type: button
              label: t:rsi.exp.continueAfterDone
              act: plugin
              args:
                request: prep
                id: $.exp.next.stop
                op: edit
              disabled: $.pending
              when:
                of: $.exp.next.k
                map:
                  done: true
                  _: false
            - type: button
              label: t:rsi.exp.wakeAgain
              act: plugin
              args:
                request: evalAgain
              disabled: $.pending
              when:
                of: $.exp.next.k
                map:
                  evaluating: true
                  _: false
      - type: each
        from:
          - {}
        when: $.exp.trend
        blocks:
          - type: label
            text:
              t: rsi.exp.trend
              args:
                - $.exp.trendMetric
                - $.exp.hitRate.hit
                - $.exp.hitRate.all
          - type: component
            use: plugin:official.rsi/rsiTrend
            props:
              from: $.exp.trend
              label: t:rsi.exp.trendLabel
      - type: each
        from:
          - {}
        when: $.exp.setup
        blocks:
          - type: each
            from: $.exp.prep.steps
            blocks:
              - type: text
                parts:
                  - text:
                      t: rsi.exp.initStep
                      args:
                        - "@i"
                        - t: rsi.exp.init
                          args:
                            - "@k"
                    strong: true
                  - status:
                      of: "@state"
                      map:
                        confirmed:
                          tone: ok
                          text: t:rsi.exp.prep.state.confirmed
                        preparing:
                          tone: info
                          text: t:rsi.exp.prep.state.preparing
                        submitted:
                          tone: warn
                          text: t:rsi.exp.prep.state.submitted
                        cancelled:
                          tone: warn
                          text: t:rsi.exp.prep.state.cancelled
                        stale:
                          tone: warn
                          text: t:rsi.exp.prep.state.stale
                        waiting:
                          tone: ""
                          text: t:rsi.exp.prep.state.waiting
                        queued:
                          tone: ""
                          text: t:rsi.exp.prep.state.queued
                        _:
                          tone: ""
                          text: t:rsi.exp.prep.state.uninvestigated
                  - text:
                      t: rsi.exp.byOf
                      args:
                        - "@by"
                    when: "@by"
                  - text:
                      t: rsi.exp.waitOnOf
                      args:
                        - "@waitOn"
                    when: "@waitOn"
                  - text:
                      t: rsi.exp.initOut
                      args:
                        - "@k"
                  - text:
                      t: rsi.exp.depsOf
                      args:
                        - "@deps"
                    when: "@deps"
                actions:
                  - type: button
                    label: t:rsi.exp.retry
                    act: plugin
                    args:
                      request: initRetry
                      k: "@k"
                    when:
                      of: "@state"
                      map:
                        _: false
                        cancelled: true
                    disabled: $.pending
              - type: list
                from: "@items"
                row: rsi.prep
              - type: text
                variant: meta
                text:
                  t: rsi.exp.unknownsOf
                  args:
                    - "@unknowns"
                when: "@unknowns"
              - type: text
                variant: meta
                text:
                  t: rsi.exp.nextOf
                  args:
                    - "@next"
                when: "@next"
          - type: label
            text: t:rsi.exp.members
          - type: list
            from: $.exp.members
            row:
              layout: two
              lead:
                who: "@catId"
                form: avatar
                when: "@catId"
              title:
                text:
                  t: rsi.exp.role
                  args:
                    - "@role"
              sub:
                parts:
                  - who: "@catId"
                    form: title
                    when: "@catId"
                  - text: "@name"
                    when: "!@catId"
              cols:
                - v:
                    text: "@model"
                    mono: true
                  w: id
              acts:
                - label: t:rsi.exp.analystRemove
                  icon: delete
                  act: plugin
                  args:
                    request: analystRemove
                    catId: "@catId"
                  when:
                    of: "@role"
                    map:
                      analyze: true
                      _: false
          - type: button
            label: t:rsi.exp.analystAdd
            when: $.exp.projectPath
            act: dialog
            args:
              kind: rsiAnalystAdd
              cats: $.members.defaultCatOptions
          - type: label
            text: t:rsi.exp.policyTitle
          - type: kv
            from:
              - k: t:rsi.exp.pol.schedule
                v: $.exp.policy.schedule.window
              - k: t:rsi.exp.pol.seeds
                v:
                  t: rsi.exp.seedsOf
                  args:
                    - $.exp.policy.seeds
              - k: t:rsi.exp.pol.vars
                v:
                  of: $.exp.policy.vars
                  sep: ；
                  item:
                    t: rsi.exp.varOf
                    args:
                      - "@name"
                      - of: "@values"
                        sep: " / "
              - k: t:rsi.exp.pol.auto
                v: $.exp.policy.autoText
      - type: toolbar
        when: "!$.exp.setup"
        items:
          - type: seg
            value: $.exp.tab
            options:
              - v: version
                label: t:rsi.tab.version
              - v: metrics
                label: t:rsi.tab.metrics
              - v: collect
                label: t:rsi.tab.collect
            act: plugSet
            args:
              k: tab
      - type: each
        from:
          - {}
        when:
          - "!$.exp.setup"
          - of: $.exp.tab
            map:
              _: false
              version: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.exp.versions
              key: "@key"
              parent: "@parentKey"
              node:
                label:
                  - text: "@id"
                state: "@nodeState"
                pressed: "@nodeSelected"
                act: plugSet
                args:
                  k: selO
                  v: "@pick"
              cells:
                - type: select
                  when: "@cyclePick"
                  id: "@cyclePick.id"
                  label: t:rsi.cycle.pick
                  change: plugSet
                  args:
                    k:
                      of: "@cyclePick.tree"
                      map:
                        rsiSelO: selO
                        rsiSelE: selE
                        rsiSelC: selC
                  value: "@cyclePick.value"
                  options:
                    - from: "@cyclePick.options"
                      item:
                        v: "@v"
                        label:
                          t: rsi.cycle.nOf
                          args:
                            - "@n"
                            - "@total"
                - type: each
                  from: "@steps"
                  control:
                    type: chip
                    label:
                      of: "@k"
                      map:
                        apply:
                          t: rsi.step.apply
                          args:
                            - t: rsi.applyResult
                              args:
                                - "@result"
                        collect:
                          of: "@live"
                          map:
                            "true":
                              t: rsi.step.collectLive
                              args:
                                - "@n"
                            _:
                              t: rsi.step.collect
                              args:
                                - "@n"
                        eval:
                          t: rsi.step.eval
                          args:
                            - "@n"
                            - t: rsi.evalResult
                              args:
                                - "@result"
                        gov:
                          t: rsi.step.gov
                          args:
                            - t: rsi.govResult
                              args:
                                - "@result"
                        cycles:
                          t: rsi.step.cycles
                          args:
                            - "@count"
                    pressed: "@selected"
                    tone:
                      of: "@result"
                      map:
                        pending: warn
                        rollback: warn
                        failed: warn
                        _: ""
                    act: plugSet
                    args:
                      k: selO
                      v: "@pick"
              tail:
                sep: " · "
                parts:
                  - text: "@change"
                  - text: "@pr"
                    mono: true
                    when: "@pr"
          - type: section
            title:
              of: $.exp.step
              map:
                node: $.exp.ver.id
                _:
                  t: rsi.detail.step
                  args:
                    - $.exp.ver.id
                    - $.exp.cycle.k
                    - t: rsi.stepName
                      args:
                        - $.exp.step
            blocks:
              - type: kv
                when:
                  of: $.exp.step
                  map:
                    _: false
                    node: true
                from:
                  - k: t:rsi.detail.change
                    v: $.exp.ver.change
                  - k: t:rsi.detail.parent
                    v: $.exp.ver.parent
                    when: $.exp.ver.parent
                  - k: t:rsi.exp.pr
                    v: $.exp.ver.pr
                    when: $.exp.ver.pr
                  - k: t:rsi.detail.at
                    v:
                      of: $.exp.ver.at
                      fmt: stamp
              - type: each
                from:
                  - {}
                when:
                  of: $.exp.step
                  map:
                    _: false
                    apply: true
                blocks:
                  - type: kv
                    from:
                      - k: t:rsi.exp.plan.by
                        v:
                          t: rsi.exp.planBy
                          args:
                            - $.exp.cycle.plan.by
                      - k: t:rsi.exp.plan.seeds
                        v:
                          of: $.exp.cycle.plan.seeds
                          sep: " "
                      - k: t:rsi.exp.plan.window
                        v: $.exp.cycle.plan.window
                  - type: list
                    id: rsi-exp-plan
                    label: t:rsi.exp.groups
                    from: $.exp.cycle.groups
                    row:
                      layout: two
                      key: "@id"
                      title: "@label"
                      inline:
                        - chip: t:rsi.exp.control
                          when: "@control"
                        - chip: t:rsi.exp.confirm
                          when: "@confirm"
                      sub:
                        sep: " · "
                        parts:
                          - text: "@version"
                            mono: true
                          - text: "@varsText"
                            mono: true
                            when: "@varsText"
                      cols:
                        - v:
                            text:
                              t: rsi.exp.doneOf
                              args:
                                - "@doneN"
                                - "@total"
                            num: true
                          w: label
                        - v:
                            text:
                              t: rsi.exp.failedOf
                              args:
                                - "@failed"
                            tone: danger
                          w: label
                          when: "@failed"
              - type: each
                from:
                  - {}
                when:
                  of: $.exp.step
                  map:
                    _: false
                    collect: true
                blocks:
                  - type: list
                    id: rsi-exp-events
                    label: t:rsi.exp.events
                    from: $.exp.cycle.events
                    optional: true
                    row:
                      layout: two
                      title: "@text"
                      sub:
                        text:
                          t: rsi.exp.event
                          args:
                            - "@kind"
                      cols:
                        - v:
                            text:
                              of: "@at"
                              fmt: stamp
                          w: time
                  - type: list
                    id: rsi-exp-runs
                    label:
                      t: rsi.exp.runs
                      args:
                        - $.exp.cycle.runs.length
                    from: $.exp.cycle.runs
                    row:
                      layout: two
                      key: "@id"
                      title:
                        text:
                          t: rsi.exp.runOf
                          args:
                            - "@groupLabel"
                            - "@seed"
                      sub:
                        sep: " · "
                        parts:
                          - text: "@env.commit"
                            mono: true
                          - text: "@env.hw"
                          - text:
                              t: rsi.exp.retries
                              args:
                                - "@retries"
                            when: "@retries"
                      cols:
                        - v:
                            text: "@metrics.return"
                            num: true
                            when: "@metrics.return"
                          w: num
                        - v:
                            status:
                              of: "@state"
                              map:
                                failed:
                                  of: "@error.kind"
                                  map:
                                    env:
                                      tone: warn
                                      text: t:rsi.exp.err.env
                                    _:
                                      tone: danger
                                      text: t:rsi.exp.err.real
                                running:
                                  tone: info
                                  text: t:rsi.exp.state.running
                                queued:
                                  tone: ""
                                  text: t:rsi.exp.state.queued
                                done:
                                  tone: ok
                                  text: t:rsi.phase2.done
                                _: ""
                          w: state
                      expand:
                        - type: kv
                          from:
                            - k: t:rsi.phase2.duration
                              v: "@durationSeconds"
                            - k: t:rsi.exp.env.commit
                              v: "@env.commit"
                            - k: t:rsi.exp.env.config
                              v: "@env.config"
                            - k: t:rsi.exp.env.hw
                              v: "@env.hw"
                            - k: t:rsi.exp.env.driver
                              v: "@env.driver"
                            - k: t:rsi.exp.env.data
                              v: "@env.data"
                            - k: t:rsi.exp.err.step
                              v: "@error.step"
                              when: "@error"
                        - type: kv
                          from: "@metricRows"
                        - type: pre
                          text: "@error.raw"
                          when: "@error"
                        - type: pre
                          text: "@log"
                          when: "@log"
              - type: each
                from:
                  - {}
                when:
                  - of: $.exp.step
                    map:
                      _: false
                      eval: true
                  - $.exp.cycle.report
                blocks:
                  - type: text
                    parts:
                      - status:
                          of: $.exp.cycle.report.verdict
                          map:
                            baseline:
                              tone: info
                              text: t:rsi.exp.verdict.baseline
                            keep:
                              tone: ok
                              text: t:rsi.exp.verdict.keep
                            tune:
                              tone: ok
                              text: t:rsi.exp.verdict.tune
                            rollback:
                              tone: warn
                              text: t:rsi.exp.verdict.rollback
                            sunset:
                              tone: ""
                              text: t:rsi.exp.verdict.sunset
                            insufficient:
                              tone: ""
                              text: t:rsi.exp.verdict.insufficient
                            _: ""
                      - text: $.exp.cycle.report.headline
                        strong: true
                  - type: markdown
                    text: $.exp.cycle.report.summary
                  - type: text
                    variant: meta
                    parts:
                      - text:
                          of: $.exp.cycle.report.compare.comparable
                          map:
                            "true":
                              t: rsi.exp.comparable
                              args:
                                - $.exp.cycle.report.compare.against
                            _: t:rsi.exp.noCompare
                      - text: " · "
                      - text: $.exp.cycle.report.compare.note
                  - type: list
                    id: rsi-exp-groups
                    label: t:rsi.exp.results
                    from: $.exp.cycle.groups
                    row:
                      layout: two
                      key: "@id"
                      title: "@label"
                      inline:
                        - chip: t:rsi.exp.control
                          when: "@control"
                        - chip: t:rsi.exp.confirm
                          when: "@confirm"
                      sub:
                        sep: " · "
                        parts:
                          - text: "@version"
                            mono: true
                          - text: "@varsText"
                            mono: true
                            when: "@varsText"
                      cols:
                        - v:
                            text:
                              t: rsi.exp.ms
                              args:
                                - "@return.mean"
                                - "@return.lo"
                                - "@return.hi"
                            when: "@return.mean"
                            num: true
                          w: auto
                        - v:
                            text:
                              t: rsi.exp.sdOf
                              args:
                                - "@sd.mean"
                            when: "@sd.mean"
                            num: true
                          w: num
                        - v:
                            text:
                              t: rsi.exp.minOf
                              args:
                                - "@wall.mean"
                            when: "@wall.mean"
                            num: true
                          w: num
                        - v:
                            text:
                              t: rsi.exp.failedOf
                              args:
                                - "@failed"
                            tone: danger
                          w: label
                          when: "@failed"
                  - type: label
                    text: t:rsi.exp.attribution
                  - type: kv
                    from:
                      - k: t:rsi.exp.attr.verdict
                        v:
                          t: rsi.exp.attrVerdict
                          args:
                            - $.exp.cycle.report.attribution.verdict
                      - k: t:rsi.exp.attr.primary
                        v:
                          of: $.exp.cycle.report.attribution.primaryLayer
                          map:
                            execution: t:rsi.exp.layer.execution
                            harness: t:rsi.exp.layer.harness
                            rubric: t:rsi.exp.layer.rubric
                            observation: t:rsi.exp.layer.observation
                            _: ""
                        when: $.exp.cycle.report.attribution.primaryLayer
                      - k: t:rsi.exp.attr.assessed
                        v:
                          of: $.exp.cycle.report.attribution.assessedLayers
                          sep: 、
                          item:
                            of: "@"
                            map:
                              execution: t:rsi.exp.layer.execution
                              harness: t:rsi.exp.layer.harness
                              rubric: t:rsi.exp.layer.rubric
                              observation: t:rsi.exp.layer.observation
                              _: "@"
                      - k: t:rsi.exp.attr.notAssessed
                        v:
                          of: $.exp.cycle.notAssessed
                          sep: 、
                          item:
                            of: "@"
                            map:
                              execution: t:rsi.exp.layer.execution
                              harness: t:rsi.exp.layer.harness
                              rubric: t:rsi.exp.layer.rubric
                              observation: t:rsi.exp.layer.observation
                              _: "@"
                        when: $.exp.cycle.notAssessed
                      - k: t:rsi.exp.attr.competing
                        v:
                          of: $.exp.cycle.report.attribution.competingLayers
                          sep: 、
                          item:
                            of: "@"
                            map:
                              execution: t:rsi.exp.layer.execution
                              harness: t:rsi.exp.layer.harness
                              rubric: t:rsi.exp.layer.rubric
                              observation: t:rsi.exp.layer.observation
                              _: "@"
                        when: $.exp.cycle.report.attribution.competingLayers
                      - k: t:rsi.exp.attr.uncertainty
                        v:
                          t: rsi.exp.uncertainty
                          args:
                            - $.exp.cycle.report.attribution.uncertainty
                      - k: t:rsi.exp.attr.comparability
                        v:
                          t: rsi.exp.comparability
                          args:
                            - $.exp.cycle.report.attribution.comparability
                  - type: list
                    from: $.exp.cycle.report.attribution.evidence
                    label: t:rsi.exp.attr.evidence
                    optional: true
                    row:
                      layout: line
                      title: "@"
                  - type: list
                    id: rsi-exp-preds
                    label: t:rsi.exp.predictions
                    optional: true
                    from: $.exp.cycle.report.predictions
                    row:
                      layout: two
                      title: "@text"
                      sub:
                        text:
                          t: rsi.exp.predOf
                          args:
                            - "@expect"
                            - "@actual"
                      cols:
                        - v:
                            status:
                              of: "@result"
                              map:
                                hit:
                                  tone: ok
                                  text: t:rsi.pred.hit
                                partial:
                                  tone: warn
                                  text: t:rsi.pred.partial
                                miss:
                                  tone: danger
                                  text: t:rsi.pred.miss
                                _:
                                  tone: info
                                  text: t:rsi.pred.pending
                          w: state
              - type: each
                from:
                  - {}
                when:
                  - of: $.exp.step
                    map:
                      _: false
                      gov: true
                  - $.exp.cycle.report
                blocks:
                  - type: notice
                    tone: warn
                    when:
                      - "!$.exp.cycle.report.agree"
                      - $.exp.cycle.waiting
                    text: t:rsi.exp.disagree
                  - type: list
                    id: rsi-exp-dirs
                    label: t:rsi.exp.directions
                    from: $.exp.cycle.report.directions
                    row:
                      layout: two
                      key: "@id"
                      lead:
                        who: "@by"
                        form: avatar
                      title: "@title"
                      inline:
                        - text:
                            t: rsi.exp.dirKind
                            args:
                              - "@kind"
                          variant: badge
                          when: "@kind"
                        - chip: t:rsi.exp.picked
                          when: "@picked"
                      sub:
                        sep: " · "
                        parts:
                          - who: "@by"
                            form: name
                          - text: "@model"
                            mono: true
                            when: "@model"
                          - text:
                              t: rsi.exp.expect
                              args:
                                - "@expect"
                            when: "@expect"
                      cols:
                        - control:
                            - type: button
                              label: t:rsi.exp.adopt
                              act: plugin
                              args:
                                request: expDecide
                                n: $.exp.cycle.n
                                pick: direction
                                directionId: "@id"
                                note: ""
                              when: $.exp.cycle.waiting
                              disabled: $.pending
                      expand:
                        - type: markdown
                          text: "@why"
                        - type: text
                          variant: meta
                          parts:
                            - text: t:rsi.exp.cites
                            - text:
                                of: "@cites"
                                sep: 、
                          when: "@cites"
                  - type: list
                    label: t:rsi.exp.asks
                    optional: true
                    from: $.exp.cycle.report.asks
                    row:
                      layout: line
                      title: "@text"
                  - type: toolbar
                    items:
                      - when: $.exp.cycle.waiting
                        type: button
                        label: t:rsi.exp.pick.info
                        act: dialog
                        args:
                          kind: rsiExpNote
                          n: $.exp.cycle.n
                          pick: info
                        disabled: $.pending
                      - when: $.exp.cycle.waiting
                        type: button
                        label: t:rsi.exp.pick.addVar
                        act: dialog
                        args:
                          kind: rsiExpNote
                          n: $.exp.cycle.n
                          pick: addVar
                        disabled: $.pending
                      - when: $.exp.cycle.waiting
                        type: button
                        label: t:rsi.exp.pick.metric
                        act: dialog
                        args:
                          kind: rsiExpNote
                          n: $.exp.cycle.n
                          pick: metric
                        disabled: $.pending
                      - when: $.exp.cycle.waiting
                        type: button
                        label: t:rsi.exp.pick.goal
                        act: dialog
                        args:
                          kind: rsiExpNote
                          n: $.exp.cycle.n
                          pick: goal
                        disabled: $.pending
                      - when: $.exp.cycle.waiting
                        type: button
                        label: t:rsi.exp.pick.same
                        act: plugin
                        args:
                          request: expDecide
                          n: $.exp.cycle.n
                          pick: same
                          note: ""
                        disabled: $.pending
                  - type: text
                    variant: meta
                    when: $.exp.cycle.decision
                    parts:
                      - text:
                          t: rsi.exp.decided
                          args:
                            - t: rsi.exp.pickName
                              args:
                                - $.exp.cycle.decision.pick
                            - $.exp.cycle.decision.by
                            - of: $.exp.cycle.decision.at
                              fmt: ago
                      - text: " · "
                        when: $.exp.cycle.decision.note
                      - text: $.exp.cycle.decision.note
                        when: $.exp.cycle.decision.note
      - type: each
        from:
          - {}
        when:
          - "!$.exp.setup"
          - of: $.exp.tab
            map:
              _: false
              metrics: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.exp.eTree
              key: "@id"
              node:
                label: "@id"
                state: current
              tail:
                - text:
                    t: rsi.exp.eCount
                    args:
                      - $.exp.metrics.items.length
          - type: list
            from: $.exp.metrics.items
            row:
              layout: two
              key: "@id"
              title: "@name"
              inline:
                - chip: t:rsi.metric.locked
                  when: "@locked"
                - chip: t:rsi.metric.guard
                  when: "@guard"
              sub: "@how"
              cols:
                - v:
                    text:
                      t: rsi.exp.dir
                      args:
                        - "@dir"
                  w: label
                - v:
                    text: "@line"
                  w: label
                  when: "@line"
      - type: each
        from:
          - {}
        when:
          - "!$.exp.setup"
          - of: $.exp.tab
            map:
              _: false
              collect: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.exp.cTree
              key: "@id"
              node:
                label: "@id"
                state: current
              tail:
                sep: " · "
                parts:
                  - text: $.exp.executor.mcp
                    mono: true
                  - text:
                      t: rsi.exp.exState
                      args:
                        - $.exp.executor.state
          - type: list
            label: t:rsi.exp.executor
            from: $.exp.executor.ops
            row:
              layout: two
              title: "@op"
              sub:
                text: "@params"
                mono: true
                when: "@params"
              cols:
                - v:
                    text: "@tool"
                    mono: true
                  w: id
          - type: list
            label: t:rsi.exp.resultMap
            from: $.exp.executor.resultMap
            row:
              layout: line
              title: "@metric"
              cols:
                - v:
                    text: "@field"
                    mono: true
                  w: id
    sources:
      exp: exp
      members: host:members
    loading: t:rsi.console.loading
    error: t:rsi.console.error
  rsi.objective:
    blocks:
      - type: head
        variant: detail
        title: $.objective.name
        sub: $.objective.statement
        actions:
          - type: status
            text:
              t: rsi.state
              args:
                - $.objective.state
            tone:
              of: $.objective.state
              map:
                pending: warn
                exhausted: warn
                baseline: info
                analyzing: info
                preparing: info
                ready: warn
                stalled: danger
                _: ""
          - type: button
            when:
              of: $.objective.state
              map:
                _: false
                ready: true
            primary: true
            label: t:rsi.life.start
            act: plugin
            args:
              request: life
              op: start
            disabled: $.pending
          - type: button
            when:
              of: $.objective.state
              map:
                _: false
                exhausted: true
            label: t:rsi.life.more
            act: plugin
            args:
              request: life
              op: more
            disabled: $.pending
          - type: button
            when:
              of: $.objective.state
              map:
                _: false
                paused: true
            label: t:rsi.life.resume
            act: plugin
            args:
              request: life
              op: resume
            disabled: $.pending
          - type: button
            when:
              of: $.objective.state
              map:
                collecting: true
                baseline: true
                pending: true
                _: false
            label: t:rsi.life.pause
            act: plugin
            args:
              request: life
              op: pause
            disabled: $.pending
          - type: button
            when: "!$.objective.setup"
            iconOnly: true
            icon: gear
            label: t:rsi.policy.title
            act: dialog
            args:
              kind: rsiPolicy
          - type: button
            iconOnly: true
            icon: delete
            label: t:rsi.delete.action
            act: dialog
            args:
              kind: rsiDelete
              objective: $.objective.id
              name: $.objective.name
      - type: text
        when: "!$.objective.setup"
        parts:
          sep: " · "
          parts:
            - text:
                t: rsi.now.line
                args:
                  - $.objective.nowLine.o
                  - $.objective.nowLine.e
                  - $.objective.nowLine.c
            - text:
                t: rsi.now.collecting
                args:
                  - $.objective.nowLine.got
                  - $.objective.nowLine.need
              when: $.objective.nowLine.collecting
        actions:
          - type: button
            when: $.objective.nowLine.pick
            label: t:rsi.now.locate
            act: plugSet
            args:
              k: selO
              also:
                tab: version
              v:
                of: $.objective.nowLine.pick
                slice:
                  - 8
      - type: text
        variant: meta
        when:
          - "!$.objective.setup"
          - $.objective.overrides
        parts:
          - text: t:rsi.policy.overridden
          - parts: $.objective.overrides
            sep: 、
            each:
              text:
                t: rsi.policy.overrideOf
                args:
                  - t: rsi.policy
                    args:
                      - "@k"
                  - of: "@k"
                    map:
                      approval:
                        t: rsi.approval
                        args:
                          - "@v"
                      eval: "@name"
                      iterate: "@name"
                      metrics: "@name"
                      _: "@v"
      - type: list
        id: rsi-setup
        when: $.objective.setup
        from: $.objective.setup
        row:
          layout: line
          key: "@k"
          title:
            text:
              t: rsi.setup
              args:
                - "@k"
          cols:
            - v:
                status:
                  of: "@on"
                  map:
                    "true":
                      tone: info
                      text: t:rsi.setupState.on
                    _:
                      of: "@done"
                      map:
                        "true":
                          tone: ok
                          text: t:rsi.setupState.done
                        _: ""
              w: state
      - type: toolbar
        when: $.objective.setup
        items:
          - type: button
            label: t:rsi.caps.open
            act: plugSet
            args:
              k: pick
              v: caps
      - type: notice
        tone: warn
        when: $.objective.card
        text:
          t: rsi.card.waiting
          args:
            - $.objective.card.from
            - $.objective.card.to
        action:
          type: button
          label: t:rsi.card.open
          act: dialog
          args:
            kind: rsiCards
            objective: $.objective.id
      - type: toolbar
        when: "!$.objective.setup"
        items:
          - type: seg
            value: $.objective.tab
            options:
              - v: version
                label: t:rsi.tab.version
              - v: metrics
                label: t:rsi.tab.metrics
              - v: collect
                label: t:rsi.tab.collect
            act: plugSet
            args:
              k: tab
      - type: each
        from:
          - {}
        when:
          - "!$.objective.setup"
          - of: $.objective.tab
            map:
              _: false
              version: true
        blocks:
          - type: component
            use: plugin:official.rsi/rsiLineage
            props:
              from: $.objective.versions
              key: "@key"
              parent: "@parentKey"
