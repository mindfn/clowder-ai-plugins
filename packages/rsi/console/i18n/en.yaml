  threadModeHelp: Reuses the current thread by default; choose a new thread if this conversation already has an objective or you want a separate thread
  threadCurrent: Use current thread (default)
  threadNew: Create new thread
  statement: What to improve (one sentence)
  statementHint: e.g. raise arithmetic accuracy without the training collapsing
  prepare: Who initializes (reviews and drafts)
  evaluate: Who evaluates (judges metrics)
  discuss: Direction discussion (optional)
  discussAdd: Add a member
  discussRemove: Remove
  iterate: Who carries out decisions
  iterateHelp: Changes the project along the direction you choose and makes the next version; one member
  stopTarget: Stop when this target is reached
  stopTargetHelp: Write “metric comparison number”, e.g. accuracy ≥ 0.45; the metric must match a step-4 metric id or name. Leave it blank to omit it.
  repair: Failures to fix by itself per night (0 = off)
  repairHelp: A failed run goes to the governance member, who fixes it, and the cycle runs again; every fix is a version you can roll back; the same error three times in a row stops it for you
  auto: Directions the night may decide by itself
  autoHelp: Inside the run window, a conclusion whose first direction is of a kind chosen here is adopted at once (several analysts must agree) and the governance member makes its version; changing the code, metrics, goal or how it runs always waits for you
