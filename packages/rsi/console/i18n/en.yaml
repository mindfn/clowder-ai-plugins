  help: Starts initialization in the current thread by default (or a new dedicated thread if chosen), moving through seven steps and @mentioning each responsible member. Agents keep drafting; items needing your judgment appear on the objective page. The machine and time window are drafted in step 3 after the agent reviews the project.
