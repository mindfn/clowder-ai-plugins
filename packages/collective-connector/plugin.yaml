pluginId: official.collective-connector
version: 0.1.0-alpha.2
contractVersion: 0.1.0
name: Collective
description:
  default: Collective backend service. Client UI remains in the Host.
  translations:
    zh-CN: Collective 后端服务；独立界面保留在宿主中。
configuration:
  - key: service
    label: Service status
    kind: operation
    required: false
    actions:
      - id: status
        label: Service status
        render: button
        action:
          method: collective.service.status
  - key: recovery
    label: Verify held local operations
    kind: operation
    required: false
    actions:
      - id: list
        label: Held operations
        render: status
        resultRender: rows
        action:
          method: collective.recovery.list
      - id: page
        label: More held operations
        render: row
        resultRender: rows
        action:
          method: collective.recovery.page
      - id: reconcile
        label: Verify result
        render: row
        resultRender: rows
        action:
          method: collective.recovery.reconcile
      - id: resume
        label: Resume this verified operation once
        render: row
        resultRender: rows
        confirm: Resume the same operation once using its verified recovery proof?
        action:
          method: collective.recovery.resume
features:
  - id: collective-backend
    name: Collective backend
    resources: []
    contributions:
      - type: browser-service
        id: collective-client-api
    capabilities:
      - data.directory
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
  dataDirectory: collective
contributions:
  - type: browser-service
    id: collective-client-api
    action:
      method: collective.http.dispatch
    routes:
      - method: POST
        path: /api/acks
        browser: service
        local: omit-origin
      - method: POST
        path: /api/auth/completions/exchange
        browser: service
