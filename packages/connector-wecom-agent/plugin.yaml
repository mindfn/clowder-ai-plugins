pluginId: official.connector.wecom-agent
version: 0.1.0-alpha.4
contractVersion: 0.1.0
name: WeCom Agent Connector
description:
  default: Receive encrypted WeCom callbacks and send replies through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收企微加密回调并发送回复。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: permissionWhitelistEnabled
    label: 启用群白名单
    kind: select
    required: false
    options:
      - value: "false"
        label: 不限制群
      - value: "true"
        label: 仅允许白名单群
  - key: permissionCommandAdminOnly
    label: 群命令仅管理员可用
    kind: select
    required: false
    options:
      - value: "false"
        label: 群成员可用
      - value: "true"
        label: 仅管理员可用
  - key: permissionAdminIdsJson
    label: 管理员身份列表（JSON）
    description: 输入供应商身份的 JSON 数组，显式空列表 [] 不会自动补入管理员。
    kind: string
    required: false
  - key: permissionGroupsJson
    label: 群白名单（JSON）
    description: 输入包含 externalChatId 和可选 label 的对象数组；保留已有群的加入时间。
    kind: string
    required: false
  - key: permissionRevision
    label: 当前权限版本
    kind: string
    required: false
    hidden: true
  - key: connector_permissions
    label: 读取连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: read
        label: 读取当前权限
        render: button
        action:
          method: permissions.read
  - key: connector_permissions_apply
    label: 应用连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: configure
        label: 应用权限设置
        render: button
        confirm: 确认以当前表单替换管理员、群白名单及限制？尚未初始化时会创建新权限；旧快照不会覆盖此设置。请先读取当前权限。
        action:
          method: permissions.configure
  - key: legacy_permissions
    label: 一次性导入旧权限
    kind: operation
    required: false
    actions:
      - id: import
        label: 导入旧权限
        render: button
        confirm: 确认从已授权的旧连接器权限快照导入？已有权限不会被覆盖。
        action:
          method: permissions.importLegacy
  - key: corpId
    label: Corp ID
    kind: string
    required: true
  - key: agentId
    label: Agent ID
    kind: string
    required: true
  - key: agentSecret
    label: Agent Secret
    kind: secret
    required: true
  - key: callbackToken
    label: Callback token
    kind: secret
    required: true
  - key: encodingAesKey
    label: Encoding AES key
    kind: secret
    required: true
contributions:
  - type: identity
    id: wecom-agent
    displayName: WeCom custom application
  - type: message-subscription
    id: wecom-agent
    binding: wecom-agent
    action:
      method: wecom-agent.outbound
    presentation: v1
  - type: media-source
    id: wecom-agent-media
    binding: wecom-agent
    readAction:
      method: wecom-agent.media-source.read
    settleAction:
      method: wecom-agent.media-source.settle
  - type: webhook
    id: wecom-agent-callback
    path: connectors/wecom-agent
    methods: [GET, POST]
    action:
      method: wecom-agent.webhook
    verificationSecretRef: callbackToken
features:
  - id: wecom-agent-messaging
    name: WeCom agent messaging
    resources: []
    contributions:
      - type: identity
        id: wecom-agent
      - type: message-subscription
        id: wecom-agent
      - type: media-source
        id: wecom-agent-media
      - type: webhook
        id: wecom-agent-callback
    capabilities:
      - plugin.config.read
      - plugin.state.get
      - plugin.state.set
      - media.read
      - message.event.subscribe
      - messaging.send
      - secret.read
      - thread.listMetadata
      - thread.readContent
      - thread.write
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
