pluginId: official.connector.feishu
version: 0.1.0-alpha.5
contractVersion: 0.1.0
name: Feishu / Lark Connector
description:
  default: Receive and send Feishu or Lark messages through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收和发送飞书或 Lark 消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: permissionWhitelistEnabled
    label: 启用群白名单
    kind: select
    required: false
    options:
      - value: "false"
        label: 不限制群
      - value: "true"
        label: 仅允许白名单群
  - key: permissionCommandAdminOnly
    label: 群命令仅管理员可用
    kind: select
    required: false
    options:
      - value: "false"
        label: 群成员可用
      - value: "true"
        label: 仅管理员可用
  - key: permissionAdminIdsJson
    label: 管理员身份列表（JSON）
    description: 输入供应商身份的 JSON 数组，显式空列表 [] 不会自动补入管理员。
    kind: string
    required: false
  - key: permissionGroupsJson
    label: 群白名单（JSON）
    description: 输入包含 externalChatId 和可选 label 的对象数组；保留已有群的加入时间。
    kind: string
    required: false
  - key: permissionRevision
    label: 当前权限版本
    kind: string
    required: false
    hidden: true
  - key: connector_permissions
    label: 读取连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: read
        label: 读取当前权限
        render: button
        action:
          method: permissions.read
  - key: connector_permissions_apply
    label: 应用连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: configure
        label: 应用权限设置
        render: button
        confirm: 确认以当前表单替换管理员、群白名单及限制？尚未初始化时会创建新权限；旧快照不会覆盖此设置。请先读取当前权限。
        action:
          method: permissions.configure
  - key: legacy_permissions
    label: 一次性导入旧权限
    kind: operation
    required: false
    actions:
      - id: import
        label: 导入旧权限
        render: button
        confirm: 确认从已授权的旧连接器权限快照导入？已有权限不会被覆盖。
        action:
          method: permissions.importLegacy
  - key: appId
    label: App ID
    kind: string
    required: false
  - key: appSecret
    label: App Secret
    kind: secret
    required: false
  - key: connectionMode
    label: Connection Mode
    kind: select
    required: false
    default: webhook
    options:
      - value: webhook
        label: Webhook
      - value: websocket
        label: WebSocket
  - key: verificationToken
    label: Verification Token
    kind: secret
    required: false
    requiredWhen:
      key: connectionMode
      value: webhook
  - key: groupBotMentionsJson
    label: Group Bot Mentions JSON
    kind: string
    required: false
    hidden: true
  - key: feishu_qr_login
    label: 飞书扫码授权
    kind: operation
    required: false
    target: [appId, appSecret, connectionMode]
    actions:
      - id: qr-generate
        label: 生成二维码
        render: button
        resultRender: img
        action:
          method: feishu.qr-generate
        next: qr-status
      - id: qr-status
        label: 等待扫码
        render: polling
        action:
          method: feishu.qr-status
        timeout: 600
        rollback: qr-generate
        next: disconnect
      - id: disconnect
        label: 断开连接
        render: button
        action:
          method: feishu.disconnect
        next: qr-generate
test:
  action:
    method: feishu.test
contributions:
  - type: identity
    id: feishu-bot
    displayName: Feishu bot
  - type: message-subscription
    id: feishu
    binding: feishu-bot
    action:
      method: feishu.outbound
    lifecycleAction:
      method: host.messaging.lifecycle
    presentation: v2
  - type: media-source
    id: feishu-media
    binding: feishu-bot
    readAction:
      method: feishu.media-source.read
    settleAction:
      method: feishu.media-source.settle
  - type: webhook
    id: feishu-events
    path: feishu/events
    methods: [POST]
    action:
      method: feishu.webhook
    verificationSecretRef: verificationToken
features:
  - id: feishu-messaging
    name: Feishu messaging
    resources: []
    contributions:
      - type: identity
        id: feishu-bot
      - type: message-subscription
        id: feishu
      - type: media-source
        id: feishu-media
      - type: webhook
        id: feishu-events
    capabilities: [plugin.config.read, plugin.state.get, plugin.state.set, media.read, message.event.subscribe, messaging.send, secret.read, thread.readContent, thread.listMetadata, thread.write]
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
