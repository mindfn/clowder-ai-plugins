pluginId: official.connector.wecom-bot
version: 0.1.0-alpha.4
contractVersion: 0.1.0
name: WeCom Bot Connector
description:
  default: Receive and send WeCom intelligent-bot messages through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收和发送企微智能机器人消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: permissionWhitelistEnabled
    label: 启用群白名单
    kind: select
    required: false
    options:
      - value: "false"
        label: 不限制群
      - value: "true"
        label: 仅允许白名单群
  - key: permissionCommandAdminOnly
    label: 群命令仅管理员可用
    kind: select
    required: false
    options:
      - value: "false"
        label: 群成员可用
      - value: "true"
        label: 仅管理员可用
  - key: permissionAdminIdsJson
    label: 管理员身份列表（JSON）
    description: 输入供应商身份的 JSON 数组，显式空列表 [] 不会自动补入管理员。
    kind: string
    required: false
  - key: permissionGroupsJson
    label: 群白名单（JSON）
    description: 输入包含 externalChatId 和可选 label 的对象数组；保留已有群的加入时间。
    kind: string
    required: false
  - key: permissionRevision
    label: 当前权限版本
    kind: string
    required: false
    hidden: true
  - key: connector_permissions
    label: 读取连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: read
        label: 读取当前权限
        render: button
        action:
          method: permissions.read
  - key: connector_permissions_apply
    label: 应用连接器权限
    kind: operation
    required: false
    target: [permissionWhitelistEnabled, permissionCommandAdminOnly, permissionAdminIdsJson, permissionGroupsJson, permissionRevision]
    actions:
      - id: configure
        label: 应用权限设置
        render: button
        confirm: 确认以当前表单替换管理员、群白名单及限制？尚未初始化时会创建新权限；旧快照不会覆盖此设置。请先读取当前权限。
        action:
          method: permissions.configure
  - key: legacy_permissions
    label: 一次性导入旧权限
    kind: operation
    required: false
    actions:
      - id: import
        label: 导入旧权限
        render: button
        confirm: 确认从已授权的旧连接器权限快照导入？已有权限不会被覆盖。
        action:
          method: permissions.importLegacy
  - key: botId
    label: Bot ID
    kind: string
    required: false
  - key: botSecret
    label: Bot Secret
    kind: secret
    required: false
  - key: wecom_validate
    label: 验证并连接
    kind: operation
    required: false
    target: [botId, botSecret]
    actions:
      - id: validate
        label: 测试并连接
        render: button
        action:
          method: wecom-bot.validate
        next: disconnect
      - id: disconnect
        label: 断开连接
        render: button
        action:
          method: wecom-bot.disconnect
        next: validate
test:
  action:
    method: wecom-bot.test
steps:
  - text: 进入企微管理端创建智能机器人 → 选「API 模式」→ 连接方式选「使用长连接」
  - text: 填写名称和可见范围，保存后获取 Bot ID 和 Secret
  - text: 在「测试并连接」面板里填写 Bot ID 和 Secret，点击后直接验证并生效（凭据随验证成功保存）
contributions:
  - type: identity
    id: wecom-bot
    displayName: WeCom intelligent bot
  - type: message-subscription
    id: wecom-bot
    binding: wecom-bot
    action:
      method: wecom-bot.outbound
    lifecycleAction:
      method: host.messaging.lifecycle
    presentation: v1
  - type: media-source
    id: wecom-bot-media
    binding: wecom-bot
    readAction:
      method: wecom-bot.media-source.read
    settleAction:
      method: wecom-bot.media-source.settle
features:
  - id: wecom-bot-messaging
    name: WeCom bot messaging
    resources: []
    contributions:
      - type: identity
        id: wecom-bot
      - type: message-subscription
        id: wecom-bot
      - type: media-source
        id: wecom-bot-media
    capabilities:
      - plugin.config.read
      - plugin.state.get
      - plugin.state.set
      - media.read
      - message.event.subscribe
      - messaging.send
      - secret.read
      - thread.listMetadata
      - thread.readContent
      - thread.write
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
