pluginId: official.connector.wecom-bot
version: 0.1.0-alpha.0
contractVersion: 0.1.0
name: WeCom Bot Connector
description:
  default: Receive and send WeCom intelligent-bot messages through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收和发送企微智能机器人消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: botId
    label: Bot ID
    kind: string
    required: true
  - key: botSecret
    label: Bot Secret
    kind: secret
    required: true
contributions:
  - type: identity
    id: wecom-bot
    displayName: WeCom intelligent bot
  - type: message-subscription
    id: wecom-bot
    binding: wecom-bot
    action:
      method: wecom-bot.outbound
features:
  - id: wecom-bot-messaging
    name: WeCom bot messaging
    resources: []
    contributions:
      - type: identity
        id: wecom-bot
      - type: message-subscription
        id: wecom-bot
    capabilities:
      - plugin.config.read
      - message.event.subscribe
      - messaging.send
      - secret.read
      - thread.listMetadata
      - thread.write
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
